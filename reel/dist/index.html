      R0 = lerp(flatR, 0.12, ball); rb = lerp(TH, 0.12, ball);
      // the paper disc slides out from under the letters, shrinking to the o's
      // footprint, then inflates into a sphere: a plane becoming a volume
      const oc = LAY.volume[1].cx;
      const sh = R.pb(t, 12.9, 13.55, E.inOutCubic);
      const inf = R.pb(t, 13.5, 14.05, E.outBack);
      if (B > 12.9) {
        R0 = lerp(1.45, 0.5, sh);
        c = [lerp(DISC[0], oc, sh), TH, lerp(DISC[2], 0.05, sh)];
      }
      if (B > 13.5) {
        rb = lerp(TH, 0.5, Math.min(1, inf));
        R0 = Math.max(rb, 0.5);
        c = [oc, lerp(TH, 0.5, inf), lerp(0.05, 0, Math.min(1, inf))];
      }
      // stadium wave: the o jumps with its neighbours
      if (B > 16 && B < 18) {
        const u = clamp((B - 16.4 - 1 * 0.14) / 0.62);
        const jump = Math.sin(Math.PI * u);
        c[1] += 0.9 * jump * jump;
        const sq = u > 0.9 ? Math.sin(Math.PI * (u - 0.9) / 0.1) * 0.2 : (u < 0.1 ? Math.sin(Math.PI * u / 0.1) * 0.2 : -jump * 0.08);
        scl = [1 + sq, 1 - sq, 1 + sq];
      }
      // hop to the tittle of `time`
      const hp = R.pb(t, 18.25, 19.0, E.inOutSine);
      if (B > 18.25) {
        const ti = LAY.time[1];
        const tx = ti.cx, ty = G.TIT.y + 0.02;
        c = [lerp(oc, tx, hp), lerp(0.5, ty, hp) + 1.1 * R.hop(hp), 0];
        R0 = rb = lerp(0.5, G.TIT.r * 1.05, E.inOutCubic(hp));
        const land = R.kick(t, 19.0, 14);
        scl = [1 + 0.25 * land, 1 - 0.25 * land, 1 + 0.25 * land];
      }
    }
    st.dot = { c, R: R0, rb, hh: 0, scl, emit: 0, spec: 0.9 };

    // ---------------------------------------------------------------- camera
    const volTarget = [0, 0.75, 0];
    let cam;
    {
      const tg = kf(t, [[12.0, [0, 0, -0.5]], [13.1, volTarget, E.whip], [14.9, [0.15, 0.7, 0]], [15.0, [LAY.volume[1].cx, 0.55, 0]], [16.0, [LAY.volume[1].cx, 0.55, 0], E.outCubic], [16.2, [0, 0.9, 0]], [18.2, [-0.1, 0.9, 0]], [19.0, [-0.1, 0.8, 0]]]);
      const yaw = kf(t, [[12.0, 0], [13.1, -0.42, E.whip], [15.0, 0.22, E.inOutSine], [16.0, 0.3, E.outCubic], [16.2, 0.55], [18.0, -0.25, E.inOutSine], [19.0, 0.0, E.inOutCubic], [23, 0.12]]);
      const pitch = kf(t, [[12.0, Math.PI / 2], [13.1, 0.22, E.whip], [15.0, 0.16], [16.0, 0.12], [16.2, 0.3], [18.0, 0.18], [19.0, 0.1], [23, 0.14]]);
      // log-distance interpolation: 400 (ortho-like) -> close perspective
      const ld = kf(t, [[12.0, Math.log(400)], [13.1, Math.log(9.5), E.whip], [15.0, Math.log(9.0)], [16.0, Math.log(2.1), E.inOutQuint], [16.2, Math.log(8.5), E.outExpo], [18.0, Math.log(9.5)], [19.0, Math.log(7.5)], [23, Math.log(6.2)]]);
      const vh = kf(t, [[12.0, 3.8], [13.1, 4.4, E.whip], [15.0, 4.1], [16.0, 3.2, E.inOutQuint], [16.2, 4.3, E.outExpo], [18.0, 4.8], [19.0, 3.4], [23, 3.1]]);
      cam = R.orbitCam(tg, yaw, pitch, Math.exp(ld), vh, 0);
      st.camDist = Math.exp(ld);
    }
    st.cam = cam;

    // ---------------------------------------------------------------- light
    const L = {};
    {
      const flatK = 1 - R.pb(t, 12.2, 13.1, E.inOutCubic);
      const sweep = R.pb(t, 14.0, 15.2, E.inOutSine);
      const az = lerp(-2.2, -0.6, sweep);
      const el = lerp(0.75, 0.55, sweep);
      const sunVol = R.norm3([Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)]);
      const sunFlat = R.norm3([-0.42, 0.8, -0.3]);
      L.sun = R.norm3(mix3(sunVol, sunFlat, flatK));
      // flat: amb 0.7 + sun 0.3 == albedo exactly on the floor
      const sunI = lerp(1.9, 0.3 / sunFlat[1], flatK);
      const night = R.pb(t, 16, 16.12) * (1 - R.pb(t, 22.8, 23));
      const warm = 1 - flatK;
      L.sunCol = mix3([sunI, sunI * lerp(1, 0.88, warm), sunI * lerp(1, 0.72, warm)], [0.05, 0.06, 0.12], night);
      L.sky = mix3(mix3([0.78, 0.82, 1.0], [1, 1, 1], flatK), [0.16, 0.18, 0.4], night);
      L.amb = lerp(lerp(0.4, 0.7, flatK), 0.2, night);
      L.rim = mix3([0, 0, 0], [0.16, 0.3, 0.7], night);
      L.tone = 1 - flatK;
      L.expo = 1.15;
      L.shadowK = lerp(9, 14, flatK);
      L.spec = lerp(0.35, 0.0, flatK);
      L.gloss = lerp(0.16, 0, flatK);
      L.fog = lerp(0.07, 0, flatK);
      L.fogStart = st.camDist + 3.5;
      const blueBg = lin(R.palette.blue);
      L.bgTop = mix3(mix3(blueBg, [0.35, 0.42, 1.0], 0.35), [0.004, 0.005, 0.02], night);
      L.bgBot = mix3(blueBg, [0.012, 0.014, 0.05], night);
      L.round = lerp(0.004, 0.035, 1 - flatK);
      st.dot.emit = night * lerp(0.2, 1.3, R.pb(t, 16.0, 16.4, E.outCubic));
      st.dot.glow = 0.12 + 0.25 * (1 - flatK) * (1 - night);
      if (night > 0) st.pal[4] = mix3(st.pal[4], lin([0.09, 0.1, 0.35]), night);
    }
    st.light = L;

    // ---------------------------------------------------------------- 4D time fx
    {
      // scene time: runs, freezes (b21), rewinds (b21.5), fast-forwards (b22)
      const tr = (x) => {
        const f = b(21), r0 = b(21.5), r1 = b(22), ff = b(23);
        if (x < f) return x - b(19);
        if (x < r0) return f - b(19);
        if (x < r1) return (f - b(19)) - (x - r0) * 2.6;
        return (f - b(19)) - (r1 - r0) * 2.6 + (x - r1) * 3.2;
      };
      st.fx.tau = B >= 19 ? tr(t) : 0;
      const on = R.pb(t, 19, 19.6, E.inOutCubic);
      st.fx.spin = on * 0.9;
      st.fx.bob = R.pb(t, 19.0, 19.3) * 0.62;
      const frozen = B >= 21 && B < 21.5;
      st.fx.slit = frozen ? 0 : R.pb(t, 19.3, 20.0, E.inOutCubic) * 1.05;
      st.fx.rgb = !frozen && B >= 20 ? 0.055 * R.pb(t, 20, 20.25) : 0;
      st.fx.ghostDt = 0.034;
    }
    return st;
  }
  R.worldState = worldState;
})(window.REEL = window.REEL || {});
</script>
<script>/* src/timeline-climax.js */
/* timeline-climax.js — b23..b27: an accelerating montage (8ths, 16ths, 32nds)
   through every dimension, stitched by dot-irises and variable-font flash
   words; b27..b28: silence; b28..b32: "Point made." */
(function (R) {
  'use strict';
  const E = R.E, b = R.b, lerp = R.lerp, inv = R.inv;
  const P = R.palette;
  const lin = (c) => c.map((v) => Math.pow(v, 2.2));

  // [beat, kind, opts]
  const CUTS = [
    [23.0, 'point', { src: 1.55, speed: 0.6, bg: P.blue, ink: P.paper, zoom: 1.35 }],
    [23.5, 'line', { src: 5.45, speed: 2.1, paper: P.ink, ink: P.paper }],
    [24.0, 'plane', { src: 9.95, floor: P.ink }],
    [24.5, 'volume', { src: 14.4, yaw: 0.75, pitch: 0.05, dist: 5.5, vh: 3.3 }],
    [25.0, 'word', { word: 'type', bg: P.orange, fg: P.ink, w0: 25, w1: 151 }],
    [25.25, 'time', { src: 20.4 }],
    [25.5, 'word', { word: 'form', bg: P.paper, fg: P.blue, w0: 151, w1: 40 }],
    [25.75, 'point', { src: 3.2, speed: 0.4, bg: P.orange, ink: P.ink, acc: P.paper }],
    [26.0, 'line', { src: 8.1, speed: 1, paper: P.blue, ink: P.paper }],
    [26.125, 'word', { word: 'space', bg: P.ink, fg: P.paper, w0: 30, w1: 140 }],
    [26.25, 'volume', { src: 16.8, yaw: -0.6, pitch: 0.35, dist: 7, vh: 4.2 }],
    [26.375, 'word', { word: 'light', bg: P.blue, fg: P.orange, w0: 151, w1: 25 }],
    [26.5, 'plane', { src: 10.8, floor: P.orange, disc: P.blue }],
    [26.625, 'word', { word: 'rhythm', bg: P.paper, fg: P.ink, w0: 25, w1: 120 }],
    [26.75, 'time', { src: 22.7 }],
    [26.875, 'point', { src: 0.55, speed: 0.5 }],
    [27.0, 'end', {}],
  ];
  R.CUTS = CUTS;
  const CH = { point: ['0D', 'point'], line: ['1D', 'line'], plane: ['2D', 'plane'], volume: ['3D', 'volume'], time: ['4D', 'time'], word: null };

  function cutAt(t) {
    const B = t / R.BEAT;
    let i = 0;
    while (i < CUTS.length - 1 && B >= CUTS[i + 1][0]) i++;
    return i;
  }

  function renderCut(i, t, target, env) {
    const [cb, kind, o] = CUTS[i];
    const u = t - b(cb);
    const src = b(o.src || 0) + u * (o.speed || 1);
    if (kind === 'point') {
      const p = R.pointState(src);
      if (o.bg) p.bg = o.bg; if (o.ink) p.ink = o.ink; if (o.acc) p.acc = o.acc;
      if (o.zoom) { p.zoom *= o.zoom; p.dot[2] *= o.zoom; }
      R.scenePoint.render(target, p, env);
    } else if (kind === 'line') {
      const p = R.lineState(src);
      if (o.paper) p.paper = o.paper; if (o.ink) p.ink = o.ink;
      R.sceneLine.render(target, p, env);
    } else if (kind === 'plane' || kind === 'volume' || kind === 'time') {
      const st = R.worldState(src);
      if (o.floor) { st.pal[4] = lin(o.floor); st.light.bgTop = st.light.bgBot = lin(o.floor); }
      if (o.disc) st.pal[2] = lin(o.disc);
      if (o.yaw != null) {
        const tg = [-0.1, 0.7, 0];
        st.cam = R.orbitCam(tg, o.yaw + u * 0.6, o.pitch, o.dist, o.vh);
        st.camDist = o.dist; st.light.fogStart = o.dist + 3.5;
      }
      R.sceneWorld.render(target, st, env);
    } else if (kind === 'word') {
      const k = E.outCubic(inv(b(cb), b(CUTS[i + 1][0]), t));
      R.sceneWords.render(target, {
        bg: o.bg, fg: o.fg, word: o.word, wdth: lerp(o.w0, o.w1, k), wght: 1000, size: 520, fit: 0,
      }, env);
    } else {
      R.sceneFinale.render(target, finaleState(t), env);
    }
  }

  // iris: the next cut opens out of the dot
  const IRIS_FS = R.GLSL + `
in vec2 vUv;
uniform sampler2D uA, uB;
uniform float uR;
uniform vec3 uRing;
void main(){
  vec2 px = designPx();
  float d = length(px - vec2(960., 540.)) - uR;
  float aa = 1. / uScale;
  float m = smoothstep(aa, -aa, d);
  vec3 c = mix(texture(uA, vUv).rgb, texture(uB, vUv).rgb, m);
  float ring = smoothstep(aa, -aa, abs(d + 9.) - 9.) * step(1., uR);
  fragColor = vec4(mix(c, uRing, ring), 1.);
}`;
  let irisProg;
  R.climax = {
    init() { irisProg = new R.Program(IRIS_FS, 'iris'); },
    render(t, target, env) {
      const i = cutAt(t);
      const cb = CUTS[i][0];
      const since = t - b(cb);
      const irisDur = 0.075;
      // iris only on the eighth-note cuts
      if (i > 0 && cb <= 24.5 && since < irisDur) {
        renderCut(i - 1, t, R.tmpA, env);
        renderCut(i, t, R.tmpB, env);
        const r = lerp(0, 1150, E.inQuad(since / irisDur));
        R.draw(irisProg, target, { uA: R.tmpA.tex, uB: R.tmpB.tex, uR: r, uRing: P.orange, uScale: env.scale, uJitter: env.jitter });
      } else renderCut(i, t, target, env);
    },
    cutAt,
    chapterAt(t) { const k = CUTS[cutAt(t)][1]; return CH[k] || null; },
  };

  // ------------------------------------------------------------ finale
  function finaleState(t) {
    const B = t / R.BEAT;
    const p = { bg: P.ink, fg: P.paper, acc: P.orange, squash: [1, 1], textA: 0, x1: 0, x2: 0, caption: 0 };
    const cx = R.W / 2, cy = R.H / 2;
    let dx = 0, sq = [1, 1];
    if (B >= 27.5 && B < 31.5) {
      p.textA = 1;
      // "point" glides in and parks; "made" is thrown in and slams into the full stop
      p.x1 = -1700 * (1 - E.outExpo(inv(b(27.5), b(27.92), t)));
      const u = inv(b(27.62), b(28), t);
      p.x2 = u < 1 ? -1700 * (1 - E.inCubic(u)) : -10 * R.ring(t, 28, 2.6, 9);
      const hit = t >= b(28) ? t - b(28) : -1;
      if (hit >= 0) {
        dx = 26 * Math.exp(-hit * 7) * Math.sin(hit * 19);
        const k = Math.exp(-hit * 16);
        sq = [1 - 0.32 * k, 1 + 0.26 * k];
      }
      p.caption = R.pb(t, 29, 29.9);
      p.captionLines = ['MOTION DESIGN REEL', 'POINT  LINE  PLANE  VOLUME  TIME', '0D—4D / 128 BPM / 15.000 S / 2026'];
    }
    // one heartbeat before the loop re-detonates
    if (B >= 31.5) { const k = Math.sin(Math.PI * R.pb(t, 31.55, 31.95)); sq = [1 + 0.12 * k, 1 + 0.12 * k]; }
    p.dot = [cx + Math.max(0, dx), cy, 20];
    p.squash = sq;
    return p;
  }
  R.finaleState = finaleState;
})(window.REEL = window.REEL || {});
</script>
<script>/* src/main.js */
/* main.js — boot, frame orchestration (motion-blur accumulation), playback. */
(function (R) {
  'use strict';
  let accum, sceneT, blit, uiCanvas, uiTex;

  // Halton(2,3) for subpixel jitter
  const halton = (i, b) => { let f = 1, r = 0; i += 1; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };

  R.boot = async function (canvas, scale = 1) {
    R.canvas = canvas;
    R.scale = scale;
    canvas.width = Math.round(R.W * scale);
    canvas.height = Math.round(R.H * scale);
    R.initGL(canvas);
    await R.fonts.load();
    blit = new R.Program(R.GLSL_BLIT, 'blit');
    R.blitProg = blit;
    alloc();
    R.post.init(canvas.width, canvas.height);
    for (const k of R.SCENES) R[k].init();
    R.ready = true;
  };

  function alloc() {
    const w = R.canvas.width, h = R.canvas.height;
    for (const t of [accum, sceneT, R.tmpA, R.tmpB]) if (t) t.dispose();
    accum = new R.Target(w, h);
    sceneT = new R.Target(w, h);
    R.tmpA = new R.Target(w, h);
    R.tmpB = new R.Target(w, h);
    uiCanvas = R.canvas2d(w, h);
    if (uiTex) R.gl.deleteTexture(uiTex.tex);
    uiTex = new R.CanvasTex(uiCanvas);
  }

  // change internal resolution without recompiling anything
  R.resize = function (scale) {
    R.scale = scale;
    R.canvas.width = Math.round(R.W * scale);
    R.canvas.height = Math.round(R.H * scale);
    alloc();
    R.post.resize(R.canvas.width, R.canvas.height);
    for (const k of R.SCENES) if (R[k].resize) R[k].resize();
  };

  // Render time t (seconds) to the default framebuffer.
  R.renderAt = function (t, opts = {}) {
    const N = opts.subframes || 1;
    const shutter = opts.shutter ?? 0.5;        // fraction of frame interval
    const env = { scale: R.scale, jitter: [0, 0], shake: [0, 0, 0] };
    if (N === 1) {
      env.shake = R.shakeAt(t);
      R.director(t, accum, env);
    } else {
      R.clear(accum, [0, 0, 0, 0]);
      for (let i = 0; i < N; i++) {
        const ts = t + ((i + 0.5) / N - 0.5) * shutter / R.FPS;
        const e = { scale: R.scale, jitter: [halton(i, 2) - 0.5, halton(i, 3) - 0.5], shake: R.shakeAt(ts) };
        R.director(ts, sceneT, e);
        R.draw(blit, accum, { uTex: sceneT.tex, uAlpha: 1 / N }, 'add');
      }
    }
    const ui = R.hud ? R.hud.draw(uiCanvas, t) : false;
    if (ui) uiTex.upload();
    R.post.run(accum, ui ? uiTex : null, Object.assign({ t }, R.lensAt(t)));
  };
})(window.REEL = window.REEL || {});
</script>

<script>
(async function () {
  const R = window.REEL;
  const q = (() => { try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(''); } })();
  const capture = q.has('capture');
  if (capture) document.body.classList.add('capture');
  const canvas = document.getElementById('c');

  // --- timeline markup: chapters + the 32-beat grid
  const CH = [[0, 5, '0D', 'point'], [5, 9, '1D', 'line'], [9, 12, '2D', 'plane'], [12, 19, '3D', 'volume'], [19, 23, '4D', 'time'], [23, 27, '∑', 'all'], [27, 32, '.', 'made']];
  const tl = document.getElementById('tl');
  const segs = CH.map(([a, b, n, name]) => {
    const d = document.createElement('div');
    d.className = 'seg';
    d.style.left = (100 * a / 32) + '%'; d.style.width = (100 * (b - a) / 32) + '%';
    d.innerHTML = `<em>${n}</em><span class="nm">${name}</span>`;
    tl.appendChild(d); return d;
  });
  const rail = document.createElement('div'); rail.className = 'rail'; tl.appendChild(rail);
  for (let i = 0; i <= 32; i++) { const k = document.createElement('div'); k.className = 'tick' + (i % 4 === 0 ? ' bar' : ''); k.style.left = (100 * i / 32) + '%'; rail.appendChild(k); }
  const fill = document.createElement('div'); fill.className = 'fill'; rail.appendChild(fill);
  const head = document.createElement('div'); head.className = 'head'; rail.appendChild(head);

  // --- boot at a resolution the device can hold
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cssW = document.getElementById('stage').clientWidth || 960;
  let scale = capture ? parseFloat(q.get('scale') || '1') : Math.max(0.5, Math.min(1, (cssW * dpr) / 1920));
  await R.boot(canvas, scale);
  window.__ready = true;
  if (capture) return;

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const veil = document.getElementById('veil'), playBtn = document.getElementById('play'), readout = document.getElementById('readout');
  let playing = !reduce, t = reduce ? R.b(14.4) : 0, last = performance.now(), slow = 0;
  const pad = (n) => String(Math.floor(n)).padStart(2, '0');
  function paint() {
    R.renderAt(t);
    const B = t / R.BEAT, beat = Math.floor(B + 1e-6);
    fill.style.width = head.style.left = (100 * t / R.DURATION) + '%';
    readout.textContent = `${pad(t)}:${pad((t % 1) * 100)}:${pad(Math.floor(t * 60) % 60)} · bar ${Math.floor(beat / 4) + 1}.${beat % 4 + 1}`;
    segs.forEach((s, i) => s.classList.toggle('on', B >= CH[i][0] && B < CH[i][1]));
    tl.setAttribute('aria-valuenow', t.toFixed(2));
  }
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing) {
      t = (t + dt) % R.DURATION;
      // adaptive resolution: step down when the device can't hold ~40 fps
      if (dt > 1 / 40) slow++; else slow = Math.max(0, slow - 1);
      if (slow > 20 && scale > 0.5) { scale = Math.max(0.5, +(scale - 0.25).toFixed(2)); R.resize(scale); slow = 0; }
    }
    paint();
    requestAnimationFrame(frame);
  }
  function setPlaying(v) { playing = v; playBtn.textContent = v ? 'Pause' : 'Play'; veil.hidden = true; last = performance.now(); }
  if (reduce) { veil.hidden = false; playBtn.textContent = 'Play'; }
  veil.addEventListener('click', () => setPlaying(true));
  playBtn.addEventListener('click', () => setPlaying(!playing));
  const seekTo = (x) => { const r = tl.getBoundingClientRect(); t = Math.max(0, Math.min(R.DURATION - 1e-3, R.DURATION * (x - r.left) / r.width)); };
  let drag = false;
  tl.addEventListener('pointerdown', (e) => { drag = true; tl.setPointerCapture(e.pointerId); seekTo(e.clientX); });
  tl.addEventListener('pointermove', (e) => { if (drag) seekTo(e.clientX); });
  tl.addEventListener('pointerup', () => { drag = false; });
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (e.code === 'ArrowRight') { setPlaying(false); t = Math.min(R.DURATION - 1e-3, t + 1 / 60); }
    else if (e.code === 'ArrowLeft') { setPlaying(false); t = Math.max(0, t - 1 / 60); }
    else if (e.code === 'BracketRight') { setPlaying(false); t = Math.min(R.DURATION - 1e-3, R.b(Math.floor(t / R.BEAT + 1e-6) + 1)); }
    else if (e.code === 'BracketLeft') { setPlaying(false); t = Math.max(0, R.b(Math.ceil(t / R.BEAT - 1e-6) - 1)); }
  });
  requestAnimationFrame(frame);
})();
</script>
