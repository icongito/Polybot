<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Point Made</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #0B0B0C;
    --ink-2: #151517;
    --line: #2a2a2e;
    --paper: #F1EEE7;
    --dim: #8f8b82;
    --orange: #FF4D17;
    --blue: #2536FF;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--paper);
    font: 12px/1.45 'Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    letter-spacing: .06em; text-transform: uppercase;
    display: grid; place-items: center; padding-inline: 16px; padding-block: 20px; box-sizing: border-box;
  }
  .wrap { width: min(100%, 1280px, calc((100vh - 170px) * 16 / 9)); min-width: min(100%, 320px); display: grid; gap: 14px; }
  header, .bar { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header b { font-weight: 600; color: var(--paper); }
  header span, .bar span { color: var(--dim); }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .veil { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(11,11,12,.72); border: 0; color: var(--paper);
          font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
  .veil[hidden] { display: none; }
  .veil i { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--orange); margin: 0 auto 10px; }
  .tl { position: relative; height: 46px; cursor: pointer; user-select: none; touch-action: none; }
  .tl .seg { position: absolute; top: 0; height: 18px; border-left: 1px solid var(--line); padding-left: 6px; color: var(--dim); white-space: nowrap; overflow: hidden; box-sizing: border-box; }
  .tl .seg.on { color: var(--paper); }
  .tl .seg em { font-style: normal; color: var(--orange); margin-right: 6px; }
  .tl .rail { position: absolute; left: 0; right: 0; top: 26px; height: 14px; }
  .tl .tick { position: absolute; top: 4px; width: 1px; height: 6px; background: var(--line); }
  .tl .tick.bar { top: 0; height: 14px; background: #4a4a50; }
  .tl .fill { position: absolute; left: 0; top: 6px; height: 2px; background: var(--paper); opacity: .35; }
  .tl .head { position: absolute; top: -4px; width: 2px; height: 22px; background: var(--orange); transform: translateX(-1px); }
  button.play { background: none; border: 1px solid var(--line); color: var(--paper); font: inherit; letter-spacing: inherit; text-transform: inherit;
                padding: 6px 12px; cursor: pointer; min-width: 84px; }
  button.play:focus-visible, .tl:focus-visible, .veil:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .readout { font-variant-numeric: tabular-nums; }
  .keys { color: var(--dim); }
  @media (max-width: 640px) { .tl .seg .nm { display: none; } .keys { display: none; } }
  body.capture { display: block; padding: 0; }
  body.capture .wrap { width: 1920px; min-width: 0; display: block; }
  body.capture header, body.capture .tl, body.capture .bar, body.capture .veil { display: none; }
  body.capture .stage { aspect-ratio: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <b>Point made.</b>
    <span>a 15-second motion reel · 0D → 4D · rendered live in WebGL2</span>
  </header>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="Motion reel: a dot becomes a line, a plane, a volume and time, then returns as the full stop of the sentence 'point made.'"></canvas>
    <button class="veil" id="veil" hidden><span><i></i>Play reel<br><span style="color:var(--dim)">contains rapid cuts and flashes</span></span></button>
  </div>
  <div class="tl" id="tl" tabindex="0" role="slider" aria-label="Timeline" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0"></div>
  <div class="bar">
    <div class="controls">
      <button class="play" id="play" type="button">Pause</button>
      <span class="readout" id="readout">00:00:00 · bar 1.1</span>
    </div>
    <span class="keys">space play · ← → frame · [ ] beat</span>
  </div>
</div>

<script>/* src/core.js */
/* core.js — beat grid, easing, and a tiny WebGL2 toolkit.
   Everything in the reel is a pure function of time, so any frame can be
   rendered in any order (scrubbing, offline capture, motion-blur subframes). */
(function (R) {
  'use strict';

  // ---------------------------------------------------------------- grid
  R.W = 1920; R.H = 1080; R.FPS = 60;
  R.BPM = 128;
  R.BEAT = 60 / R.BPM;            // 0.46875 s
  R.BEATS = 32;                   // 8 bars of 4/4
  R.DURATION = R.BEATS * R.BEAT;  // exactly 15.000 s
  R.b = (n) => n * R.BEAT;        // beat -> seconds

  // ---------------------------------------------------------------- math
  const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  const lerp = (a, b, t) => a + (b - a) * t;
  const inv = (a, b, x) => clamp((x - a) / (b - a));
  const smooth = (a, b, x) => { const t = inv(a, b, x); return t * t * (3 - 2 * t); };
  const fract = (x) => x - Math.floor(x);
  const hash = (n) => fract(Math.sin(n * 127.1 + 311.7) * 43758.5453123);
  R.clamp = clamp; R.lerp = lerp; R.inv = inv; R.smooth = smooth; R.fract = fract; R.hash = hash;
  R.mixv = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));

  R.hex = (h) => {
    const n = parseInt(h.slice(1), 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  };
  R.rgba = (c, a = 1) => `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${a})`;

  // ---------------------------------------------------------------- easing
  // CSS-style cubic-bezier, solved with Newton + bisection fallback.
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t;
    const sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return (x) => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) {
        const e = sx(t) - x; if (Math.abs(e) < 1e-6) return sy(t);
        const d = dx(t); if (Math.abs(d) < 1e-6) break; t -= e / d;
      }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (v < x) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const E = {
    linear: (t) => t,
    inQuad: (t) => t * t,
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    inCubic: (t) => t * t * t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outQuart: (t) => 1 - Math.pow(1 - t, 4),
    outQuint: (t) => 1 - Math.pow(1 - t, 5),
    inQuint: (t) => t * t * t * t * t,
    inOutQuint: (t) => (t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2),
    outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
    inExpo: (t) => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10)),
    inOutExpo: (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2),
    outBack: (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
    inBack: (t, s = 1.70158) => (s + 1) * t * t * t - s * t * t,
    outSine: (t) => Math.sin((t * Math.PI) / 2),
    inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
    // damped spring settling on 1 (critically-underdamped look)
    spring: (t, f = 4.5, d = 6) => (t <= 0 ? 0 : 1 - Math.exp(-d * t) * Math.cos(f * Math.PI * 2 * t * 0.5)),
    bezier,
  };
  // House curves — the "signature" feel of the piece.
  E.snap = bezier(0.75, 0, 0.1, 1);      // hard in, glassy out
  E.whip = bezier(0.85, 0, 0.15, 1);     // extreme in-out for camera whips
  E.glide = bezier(0.3, 0, 0, 1);        // soft settle
  E.drop = bezier(0.6, 0, 1, 0.6);       // gravity-ish acceleration
  R.E = E;

  // progress helpers on the beat grid
  R.pb = (t, b0, b1, ease = E.linear) => ease(inv(R.b(b0), R.b(b1), t));
  R.ps = (t, s0, s1, ease = E.linear) => ease(inv(s0, s1, t));
  // decaying impulse after a hit (0 before, 1 at hit, decays)
  R.kick = (t, bHit, decay = 10) => { const d = t - R.b(bHit); return d < 0 ? 0 : Math.exp(-d * decay); };
  // damped oscillation after a hit
  R.ring = (t, bHit, freq = 9, decay = 7) => { const d = t - R.b(bHit); return d < 0 ? 0 : Math.exp(-d * decay) * Math.sin(d * freq * Math.PI * 2); };
  // bouncing-ball arc between two beats: returns {x:0..1, y:0..1(height)} parabolic
  R.hop = (u) => 4 * u * (1 - u);

  // ---------------------------------------------------------------- WebGL2
  const VS = `#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.,1.); }`;

  R.initGL = function (canvas) {
    const gl = canvas.getContext('webgl2', {
      antialias: false, alpha: false, depth: false, stencil: false,
      preserveDrawingBuffer: true, premultipliedAlpha: false, powerPreference: 'high-performance',
    });
    if (!gl) throw new Error('WebGL2 not available');
    R.floatOK = !!gl.getExtension('EXT_color_buffer_float');
    gl.getExtension('OES_texture_float_linear');
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    R.gl = gl;
    return gl;
  };

  function compile(gl, type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(s);
      const lines = src.split('\n').map((l, i) => `${String(i + 1).padStart(4)}: ${l}`).join('\n');
      console.error(lines);
      throw new Error('Shader compile error: ' + log);
    }
    return s;
  }

  R.Program = class Program {
    constructor(fs, name = 'prog') {
      const gl = R.gl;
      this.name = name;
      const p = gl.createProgram();
      gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, VS));
      gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs));
      gl.bindAttribLocation(p, 0, 'aPos');
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(name + ' link error: ' + gl.getProgramInfoLog(p));
      this.p = p;
      this.u = {};
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      let unit = 0;
      for (let i = 0; i < n; i++) {
        const info = gl.getActiveUniform(p, i);
        const nm = info.name.replace(/\[0\]$/, '');
        const loc = gl.getUniformLocation(p, info.name);
        const u = { loc, type: info.type, size: info.size };
        if (info.type === gl.SAMPLER_2D) u.unit = unit++;
        this.u[nm] = u;
      }
    }
    set(name, v) {
      const gl = R.gl, u = this.u[name];
      if (!u) return;
      switch (u.type) {
        case gl.FLOAT: u.size > 1 ? gl.uniform1fv(u.loc, v) : gl.uniform1f(u.loc, v); break;
        case gl.FLOAT_VEC2: gl.uniform2fv(u.loc, v); break;
        case gl.FLOAT_VEC3: gl.uniform3fv(u.loc, v); break;
        case gl.FLOAT_VEC4: gl.uniform4fv(u.loc, v); break;
        case gl.INT: case gl.BOOL: gl.uniform1i(u.loc, v); break;
        case gl.FLOAT_MAT3: gl.uniformMatrix3fv(u.loc, false, v); break;
        case gl.FLOAT_MAT4: gl.uniformMatrix4fv(u.loc, false, v); break;
        case gl.SAMPLER_2D:
          gl.activeTexture(gl.TEXTURE0 + u.unit);
          gl.bindTexture(gl.TEXTURE_2D, v && v.tex ? v.tex : v);
          gl.uniform1i(u.loc, u.unit);
          break;
        default: throw new Error('uniform type not handled: ' + name);
      }
    }
  };

  // Render target (texture-backed framebuffer)
  R.Target = class Target {
    constructor(w, h, opts = {}) {
      const gl = R.gl;
      this.w = w; this.h = h;
      const float = opts.float !== false && R.floatOK;
      this.tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, this.tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, float ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, float ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
      const f = opts.nearest ? gl.NEAREST : gl.LINEAR;
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      this.fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.tex, 0);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }
    dispose() { const gl = R.gl; gl.deleteFramebuffer(this.fb); gl.deleteTexture(this.tex); }
  };

  // Texture fed from a 2D canvas each frame
  R.CanvasTex = class CanvasTex {
    constructor(canvas) {
      const gl = R.gl;
      this.canvas = canvas;
      this.tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, this.tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    }
    upload() {
      const gl = R.gl;
      gl.bindTexture(gl.TEXTURE_2D, this.tex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, this.canvas);

  R.draw = function (prog, target, uniforms = {}, blend = null) {

  R.GLSL = `#version 300 es

precision highp int;
out vec4 fragColor;

uniform float uScale;      // device px per design px (1 at 1920x1080)
uniform vec2 uJitter;      // subpixel AA jitter (device px)

#define TAU 6.28318530718

float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+17.1; a*=.5; } return s; }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
float sat(float x){ return clamp(x,0.,1.); }
vec3 srgb2lin(vec3 c){ return pow(c, vec3(2.2)); }

  R.GLSL_BLIT = R.GLSL + `
in vec2 vUv;
uniform sampler2D uTex;
uniform float uAlpha;
void main(){ vec4 c = texture(uTex, vUv); fragColor = c * uAlpha; }`;

<script>/* src/glyphs.js */
/* glyphs.js — a small constructed, geometric lowercase alphabet (Bayer/Bauhaus
   lineage) defined as signed-distance parts. The same skeleton is rendered as
   halftone dots (0D), a single line (1D), paper planes (2D), solids (3D) and
   time-smeared solids (4D): every chapter word is made of what it names.
   Units: x-height = 1, baseline y = 0, y up. Stroke weight W. */
(function (R) {
  'use strict';
  const W = 0.25;           // stroke weight
  const TRACK = 0.13;       // letter spacing
  const TIT = { y: 1.36, r: 0.16 }; // tittle (the protagonist dot lives here)

  const wh = W / Math.cos(Math.atan(0.5)); // horizontal stroke width of v diagonals
  const deg = Math.PI / 180;

  // part: {t:type, ...}; types: box(c,h) ring(c,r) arcU(c,r) arcD(c,r) gap(c,r,a0,a1) poly(pts) disc(c,r)
  const L = {
    p: { adv: 1, parts: [{ t: 'box', c: [W / 2, 0.25], h: [W / 2, 0.75] }, { t: 'ring', c: [0.5, 0.5], r: 0.5 }] },
    o: { adv: 1, parts: [{ t: 'ring', c: [0.5, 0.5], r: 0.5 }] },
    l: { adv: W, parts: [{ t: 'box', c: [W / 2, 0.75], h: [W / 2, 0.75] }] },
    a: { adv: 1, parts: [{ t: 'ring', c: [0.5, 0.5], r: 0.5 }, { t: 'box', c: [1 - W / 2, 0.5], h: [W / 2, 0.5] }] },
    n: { adv: 1, parts: [{ t: 'box', c: [W / 2, 0.5], h: [W / 2, 0.5] }, { t: 'arcU', c: [0.5, 0.5], r: 0.5 }, { t: 'box', c: [1 - W / 2, 0.25], h: [W / 2, 0.25] }] },
    e: { adv: 1, parts: [{ t: 'gap', c: [0.5, 0.5], r: 0.5, a0: -60 * deg, a1: -21 * deg }, { t: 'box', c: [0.5, 0.5], h: [0.5 - W / 2, W / 2] }] },
    v: { adv: 1, parts: [{ t: 'vee', c: [0.5, 0.5] }] },
    u: { adv: 1, parts: [{ t: 'box', c: [W / 2, 0.75], h: [W / 2, 0.25] }, { t: 'arcD', c: [0.5, 0.5], r: 0.5 }, { t: 'box', c: [1 - W / 2, 0.5], h: [W / 2, 0.5] }] },
    m: { adv: 1.55, parts: [
      { t: 'box', c: [W / 2, 0.275], h: [W / 2, 0.275] },
      { t: 'arcU', c: [0.45, 0.55], r: 0.45 },
      { t: 'box', c: [0.9 - W / 2, 0.275], h: [W / 2, 0.275] },
      { t: 'arcU', c: [1.1, 0.55], r: 0.45 },
      { t: 'box', c: [1.55 - W / 2, 0.275], h: [W / 2, 0.275] }] },
    t: { adv: 0.66, parts: [{ t: 'box', c: [0.3, 0.68], h: [W / 2, 0.68] }, { t: 'box', c: [0.33, 1 - W / 2], h: [0.33, W / 2] }] },
    i: { adv: W, parts: [{ t: 'box', c: [W / 2, 0.5], h: [W / 2, 0.5] }], tittle: { c: [W / 2, TIT.y], r: TIT.r } },
    d: { adv: 1, parts: [{ t: 'ring', c: [0.5, 0.5], r: 0.5 }, { t: 'box', c: [1 - W / 2, 0.75], h: [W / 2, 0.75] }] },
    ' ': { adv: 0.3, parts: [] },
  };

  function layout(word, track = TRACK) {
    let x = 0; const out = [];
    for (const ch of word) {
      const g = L[ch]; if (!g) throw new Error('glyph missing: ' + ch);
      out.push({ ch, x, g });
      x += g.adv + track;
    }
    return { letters: out, width: x - track };
  }

  const f = (v) => (Number.isInteger(v) ? v.toFixed(1) : String(+v.toFixed(5)));
  const v2 = (a) => `vec2(${f(a[0])},${f(a[1])})`;

  // GLSL expression for one part, evaluated at vec2 `q` (letter-local)
  function partExpr(pt, q = 'q', w = 'GW') {
    switch (pt.t) {
      case 'box': return `sdBox2(${q},${v2(pt.c)},${v2(pt.h)})`;
      case 'ring': return `sdRing2(${q},${v2(pt.c)},${f(pt.r)},${w})`;
      case 'arcU': return `max(sdRing2(${q},${v2(pt.c)},${f(pt.r)},${w}), ${f(pt.c[1])}-${q}.y)`;
      case 'arcD': return `max(sdRing2(${q},${v2(pt.c)},${f(pt.r)},${w}), ${q}.y-${f(pt.c[1])})`;
      case 'gap': {
        const am = 0.5 * (pt.a0 + pt.a1), ha = 0.5 * (pt.a1 - pt.a0);
        return `sdGap2(${q},${v2(pt.c)},${f(pt.r)},${w},vec2(${f(Math.cos(-am))},${f(Math.sin(-am))}),vec2(${f(-Math.sin(ha))},${f(Math.cos(ha))}))`;
      }
      case 'vee': return `sdVee2(${q})`;
      case 'poly': return `sdPoly6(${q}, vec2[6](${pt.pts.map(v2).join(',')}))`;
      case 'disc': return `(length(${q}-${v2(pt.c)})-${f(pt.r)})`;
    }
    throw new Error('part type ' + pt.t);
  }

  // Static word SDF (union of all parts, tittles optional)
  function wordGLSL(fn, word, { track = TRACK, tittles = false } = {}) {
    const lay = layout(word, track);
    let s = `float ${fn}(vec2 p){ float d = 1e5; vec2 q;\n`;
    for (const lt of lay.letters) {
      s += `  q = p - vec2(${f(lt.x)}, 0.);\n`;
      for (const pt of lt.g.parts) s += `  d = min(d, ${partExpr(pt)});\n`;
      if (tittles && lt.g.tittle) s += `  d = min(d, length(q-${v2(lt.g.tittle.c)})-${f(lt.g.tittle.r)});\n`;
    }
    return s + '  return d; }\n';
  }

  const GLSL_SDF2 = `
#define GW ${f(W)}
float sdBox2(vec2 p, vec2 c, vec2 h){ vec2 d = abs(p-c)-h; return length(max(d,0.)) + min(max(d.x,d.y),0.); }
float sdRing2(vec2 p, vec2 c, float r, float w){ return abs(length(p-c) - (r - w*.5)) - w*.5; }
float sdWedge2(vec2 q, float ha){ q.y = abs(q.y); return dot(q, vec2(-sin(ha), cos(ha))); }
float sdRingGap2(vec2 p, vec2 c, float r, float w, float a0, float a1){
  float d = sdRing2(p,c,r,w);
  vec2 q = p - c; float am = .5*(a0+a1), ha = .5*(a1-a0);
  float cs = cos(-am), sn = sin(-am);
  q = vec2(cs*q.x - sn*q.y, sn*q.x + cs*q.y);
  return max(d, -sdWedge2(q, ha));
}
float sdGap2(vec2 p, vec2 c, float r, float w, vec2 cs, vec2 n){
  float d = sdRing2(p,c,r,w);
  vec2 q = p - c; q = vec2(cs.x*q.x - cs.y*q.y, cs.y*q.x + cs.x*q.y);
  q.y = abs(q.y);
  return max(d, -dot(q, n));
}
float sdSeg2(vec2 p, vec2 a, vec2 b, float th){ vec2 ba = b-a; float l = length(ba); vec2 d = ba/l; vec2 q = p - (a+b)*.5; q = vec2(d.x*q.x + d.y*q.y, -d.y*q.x + d.x*q.y); q = abs(q) - vec2(l, th)*.5; return length(max(q,0.)) + min(max(q.x,q.y),0.); }
float sdVee2(vec2 p){
  const float wh = ${f(wh)};
  vec2 a = vec2(wh*.5 - .05, 1.1), b = vec2(wh*.5 + .55, -.1);
  float d = min(sdSeg2(p, a, b, GW), sdSeg2(vec2(1.-p.x, p.y), a, b, GW));
  const float k = .894427191;
  d = max(d, (.5 - p.x - .5*p.y) * k);
  d = max(d, (p.x - .5 - .5*p.y) * k);
  return max(d, max(-p.y, p.y - 1.));
}
float sdPoly6(vec2 p, vec2 v[6]){
  float d = dot(p-v[0],p-v[0]); float s = 1.0;
  for(int i=0, j=5; i<6; j=i, i++){
    vec2 e = v[j]-v[i]; vec2 w = p-v[i];
    vec2 b = w - e*clamp(dot(w,e)/dot(e,e),0.,1.);
    d = min(d, dot(b,b));
    bvec3 c = bvec3(p.y>=v[i].y, p.y<v[j].y, e.x*w.y>e.y*w.x);
    if(all(c) || all(not(c))) s *= -1.0;
  }
  return s*sqrt(d);
}
`;

  // Canvas2D renderer for the same parts (y-up glyph space -> y-down canvas)
  function drawWord(ctx, word, x0, base, em, fill, { track = TRACK, tittles = true } = {}) {
    const lay = layout(word, track);
    ctx.fillStyle = fill;
    for (const lt of lay.letters) {
      const X = (gx) => x0 + (lt.x + gx) * em, Y = (gy) => base - gy * em;
      for (const pt of lt.g.parts) {
        ctx.beginPath();
        if (pt.t === 'box') {
          ctx.rect(X(pt.c[0] - pt.h[0]), Y(pt.c[1] + pt.h[1]), 2 * pt.h[0] * em, 2 * pt.h[1] * em);
        } else if (pt.t === 'vee') {
          const P = [[0, 1], [0.5, 0], [1, 1], [1 - wh, 1], [0.5, 2 * wh], [wh, 1]];
          P.forEach((q, i) => (i ? ctx.lineTo(X(q[0]), Y(q[1])) : ctx.moveTo(X(q[0]), Y(q[1]))));
          ctx.closePath();
        } else {
          const cx = X(pt.c[0]), cy = Y(pt.c[1]), ro = pt.r * em, ri = (pt.r - W) * em;
          let a0 = 0, a1 = Math.PI * 2;                       // canvas angles, clockwise
          if (pt.t === 'arcU') { a0 = Math.PI; a1 = Math.PI * 2; }
          if (pt.t === 'arcD') { a0 = 0; a1 = Math.PI; }
          if (pt.t === 'gap') { a0 = -(pt.a0 + Math.PI * 2); a1 = -pt.a1; }
          if (pt.t === 'ring') { ctx.arc(cx, cy, ro, 0, Math.PI * 2); ctx.moveTo(cx + ri, cy); ctx.arc(cx, cy, ri, Math.PI * 2, 0, true); }
          else { ctx.arc(cx, cy, ro, a0, a1); ctx.arc(cx, cy, ri, a1, a0, true); ctx.closePath(); }
        }
        ctx.fill();
      }
      if (tittles && lt.g.tittle) { ctx.beginPath(); ctx.arc(X(lt.g.tittle.c[0]), Y(lt.g.tittle.c[1]), lt.g.tittle.r * em, 0, Math.PI * 2); ctx.fill(); }
    }
    return lay.width * em;
  }

  R.glyphs = { W, TRACK, TIT, L, layout, partExpr, wordGLSL, GLSL_SDF2, fmt: f, v2, drawWord };
})(window.REEL = window.REEL || {});
</script>
<script>/* src/fonts.js */
/* fonts.js — loads the type system into FontFace objects.
   Canvas2D can't animate a variable font's width axis, so Roboto Flex is
   registered once per width step ("Flex-w<N>", pinned by the stretch
   descriptor). Weight stays continuous through the numeric font-weight. */
(function (R) {
  'use strict';
  const SRC = {
    flex: 'fonts/RobotoFlex.woff2',
    mono: 'fonts/GeistMono.woff2',
  };
  const WSTEP = 2, WMIN = 25, WMAX = 151;

  async function buf(key) {
    if (R.FONT_DATA && R.FONT_DATA[key]) { // single-file build: base64 payloads
      const bin = atob(R.FONT_DATA[key]);
      const u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      return u8.buffer;
    }
    const r = await fetch(SRC[key]);
    if (!r.ok) throw new Error('font fetch failed: ' + SRC[key]);
    return r.arrayBuffer();
  }

  async function add(family, data, desc) {
    const f = new FontFace(family, data, desc);
    await f.load();
    document.fonts.add(f);
  }

  R.fonts = {
    async load() {
      const [flex, mono] = await Promise.all(['flex', 'mono'].map(buf));
      const jobs = [];
      for (let w = WMIN; w <= WMAX; w += WSTEP) jobs.push(add('Flex-w' + w, flex, { stretch: w + '%', weight: '100 1000' }));
      jobs.push(add('Mono', mono, { weight: '100 900' }));
      await Promise.all(jobs);
    },
    // CSS font string for Roboto Flex at an arbitrary width/weight
    flex(px, wdth = 100, wght = 400) {
      const w = Math.max(WMIN, Math.min(WMAX, WMIN + Math.round((wdth - WMIN) / WSTEP) * WSTEP));
      return `${Math.round(Math.max(100, Math.min(1000, wght)))} ${px}px 'Flex-w${w}'`;
    },
    mono(px, wght = 450) { return `${wght} ${px}px 'Mono'`; },
  };
})(window.REEL = window.REEL || {});
</script>
<script>/* src/post.js */
/* post.js — the "lens": bloom, radial chromatic aberration, flash, vignette,
   UI overlay and film grain. Applied once per output frame. */
(function (R) {
  'use strict';
  const BRIGHT_FS = R.GLSL + `
in vec2 vUv;
uniform sampler2D uTex;
uniform float uThresh;
void main(){
  vec2 px = 1. / vec2(textureSize(uTex, 0));
  vec3 c = vec3(0.);
  // 4-tap box downsample
  c += texture(uTex, vUv + px*vec2(-1.,-1.)).rgb;
  c += texture(uTex, vUv + px*vec2( 1.,-1.)).rgb;
  c += texture(uTex, vUv + px*vec2(-1., 1.)).rgb;
  c += texture(uTex, vUv + px*vec2( 1., 1.)).rgb;
  c *= .25;
  float l = max(c.r, max(c.g, c.b));
  float k = smoothstep(uThresh, uThresh + .35, l);
  fragColor = vec4(c * k, 1.);
}`;
  const BLUR_FS = R.GLSL + `
in vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uDir;
void main(){
  vec2 px = uDir / vec2(textureSize(uTex, 0));
  // 9-tap gaussian via linear sampling (5 fetches)
  vec3 c = texture(uTex, vUv).rgb * .2270270270;
  c += texture(uTex, vUv + px*1.3846153846).rgb * .3162162162;
  c += texture(uTex, vUv - px*1.3846153846).rgb * .3162162162;
  c += texture(uTex, vUv + px*3.2307692308).rgb * .0702702703;
  c += texture(uTex, vUv - px*3.2307692308).rgb * .0702702703;
  fragColor = vec4(c, 1.);
}`;
  const POST_FS = R.GLSL + `
in vec2 vUv;
uniform sampler2D uScene, uBloomA, uBloomB, uUI;
uniform float uCA, uGrain, uVig, uBloom, uTime, uUIOn, uInvert;
uniform vec4 uFlash;
void main(){
  vec2 uv = vUv;
  vec2 d = uv - .5;
  float r2 = dot(d * vec2(1.7778, 1.), d * vec2(1.7778, 1.));
  vec3 col;
  if (uCA > 0.0005) {
    vec2 off = d * uCA * (.35 + r2 * 1.6);
    col.r = texture(uScene, uv - off).r;
    col.g = texture(uScene, uv - off * .35).g;
    col.b = texture(uScene, uv + off).b;
  } else col = texture(uScene, uv).rgb;
  col += (texture(uBloomA, uv).rgb * .6 + texture(uBloomB, uv).rgb * .8) * uBloom;
  col = mix(col, uFlash.rgb, uFlash.a);
  col = mix(col, vec3(1.) - clamp(col, 0., 1.), uInvert);
  if (uUIOn > .5) { vec4 ui = texture(uUI, uv); col = col * (1. - ui.a) + ui.rgb; }
  col *= 1. - uVig * smoothstep(.15, 1.3, r2);
  // soft highlight rolloff (keeps HDR flashes filmic)
  col = col / (1. + max(col - 1., 0.) * .6);
  float g = hash12(floor(gl_FragCoord.xy) + fract(uTime * 13.37) * 917.) - .5;
  float g2 = hash12(floor(gl_FragCoord.xy * .5) + fract(uTime * 7.1) * 311.) - .5;
  float lum = dot(col, vec3(.299,.587,.114));
  col += (g * .75 + g2 * .5) * uGrain * (.55 + .45 * (1. - abs(lum * 2. - 1.)));
  fragColor = vec4(clamp(col, 0., 1.), 1.);
}`;

  let bright, blur, post, bA1, bA2, bB1, bB2;
  R.post = {
    init(w, h) {
      bright = new R.Program(BRIGHT_FS, 'bright');
      blur = new R.Program(BLUR_FS, 'blur');
      post = new R.Program(POST_FS, 'post');
      this.resize(w, h);
    },
    resize(w, h) {
      for (const t of [bA1, bA2, bB1, bB2]) if (t) t.dispose();
      bA1 = new R.Target(w >> 2, h >> 2); bA2 = new R.Target(w >> 2, h >> 2);
      bB1 = new R.Target(w >> 3, h >> 3); bB2 = new R.Target(w >> 3, h >> 3);
    },
    run(sceneTarget, uiTex, p) {
      // bloom chain
      R.draw(bright, bA1, { uTex: sceneTarget.tex, uThresh: p.thresh ?? 0.92 });
      R.draw(blur, bA2, { uTex: bA1.tex, uDir: [1, 0] });
      R.draw(blur, bA1, { uTex: bA2.tex, uDir: [0, 1] });
      R.draw(blur, bB1, { uTex: bA1.tex, uDir: [1.5, 0] });
      R.draw(blur, bB2, { uTex: bB1.tex, uDir: [0, 1.5] });
      R.draw(blur, bB1, { uTex: bB2.tex, uDir: [2.5, 0] });
      R.draw(blur, bB2, { uTex: bB1.tex, uDir: [0, 2.5] });
      R.draw(post, null, {
        uScene: sceneTarget.tex, uBloomA: bA1.tex, uBloomB: bB2.tex, uUI: uiTex ? uiTex.tex : bA1.tex,
        uUIOn: uiTex ? 1 : 0, uCA: p.ca || 0, uGrain: p.grain ?? 0.045, uVig: p.vig ?? 0.25,
        uBloom: p.bloom ?? 0.6, uTime: p.t || 0, uFlash: p.flash || [0, 0, 0, 0], uInvert: p.invert || 0,
      });
    },
  };
})(window.REEL = window.REEL || {});

<script>/* src/scene-point.js */
/* scene-point.js — 0D. The dot detonates into a halftone field; the shock
   front "develops" the word `point` out of thousands of points, with the
   protagonist dot sitting as the tittle of the i. */
(function (R) {
  'use strict';
  const G = R.glyphs;
  const CELL = 18;                 // halftone pitch (world px)
  const GX = Math.ceil(R.W / CELL) + 4, GY = Math.ceil(R.H / CELL) + 4; // + margin
  const MARGIN = 2;
  const EM = 340;                  // px per x-height
  // tittle of the i sits exactly at frame centre
  const lay = G.layout('point');
  const iLetter = lay.letters.find((l) => l.ch === 'i');
  const titG = [iLetter.x + G.W / 2, G.TIT.y];
  const ORIGIN = [R.W / 2 - titG[0] * EM, R.H / 2 + titG[1] * EM]; // baseline-left, y down
  const TIT_R = G.TIT.r * EM;

  const FIELD_FS = R.GLSL + G.GLSL_SDF2 + G.wordGLSL('sdWord', 'point') + `
uniform float uT, uBoom, uInvX, uCollapse, uEm, uCell, uDev;
uniform vec2 uOrigin, uCenter;
void main(){
  vec2 cell = floor(gl_FragCoord.xy) - float(${MARGIN});
  vec2 c = (cell + .5) * uCell;                       // world px, y down
  float d0 = length(c - uCenter);
  // shock front
  float speed = 2900.;
  float front = uBoom * speed;
  float behind = front - d0;
  float crest = exp(-pow((d0 - front) / 70., 2.)) * step(0., uBoom);
  // letter coverage
  vec2 g = vec2(c.x - uOrigin.x, uOrigin.y - c.y) / uEm;
  float sd = sdWord(g) * uEm;
  float inside = smoothstep(uCell*.9, -uCell*.9, sd);
  float develop = smoothstep(0., 420., behind) * uDev;
  float n = fbm(c * .0045 + vec2(uT*.35, -uT*.2));
  float rOut = .07 + .12 * n;
  float rIn = .66;
  float rNorm = mix(rOut, rIn, inside * develop);
  // inversion wave: letters empty out while the ground fills in
  float invw = smoothstep(uInvX + 70., uInvX - 70., c.x);
  float crestInv = exp(-pow((c.x - uInvX) / 90., 2.));
  float rInv = mix(.63 + .05 * n, .05 + .06 * n, inside);
  float r = mix(rNorm, rInv, invw * develop);
  float age = max(behind, 0.) / speed;
  r *= 1. + .45 * sin(age * 26.) * exp(-age * 5.5) * step(0., behind);
  r *= step(0., behind + 30.);
  r += crest * .38 + crestInv * .22 * develop;
  // collapse: the field is eaten from the edges toward the dot
  float k = smoothstep(uCollapse, uCollapse - 260., d0);
  r *= k;
  float acc = sat(crest * 1.4 + crestInv * .9 * develop);
  fragColor = vec4(max(r, 0.), acc, inside, 1.);
}`;

  const DOTS_FS = R.GLSL + `
uniform sampler2D uField;
uniform float uZoom, uCell, uT, uFront, uRefr, uZoomRot;
uniform vec2 uCenter;
uniform vec2 uFocus;
uniform vec3 uShake;
uniform vec3 uBg, uInk, uAcc;
uniform vec4 uDot;       // x, y, r, glow
uniform vec2 uSquash;    // x/y scale of the dot
uniform float uDotRot;
void main(){
  vec2 px = designPx();
  px = rot(uShake.z) * (px - vec2(960.,540.)) + vec2(960.,540.) + uShake.xy;
  vec2 w = uFocus + rot(uZoomRot) * (px - uFocus) / uZoom;
  vec2 dv = w - uCenter; float dl = length(dv);
  w -= dv / max(dl, 1.) * exp(-pow((dl - uFront) / 110., 2.)) * uRefr;
  vec2 cc = w / uCell;
  vec2 ci = floor(cc);
  float aa = .8 / (uZoom * uScale);
  float cov = 0., acc = 0.;
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 cid = ci + vec2(i,j);
    vec4 f = texelFetch(uField, ivec2(cid) + ivec2(${MARGIN}), 0);
    float r = f.r * uCell;
    float d = length(w - (cid + .5) * uCell) - r;
    float c = smoothstep(aa, -aa, d) * step(.001, f.r);
    if (c > cov) { cov = c; acc = f.g; }
  }
  vec3 dotc = mix(uInk, uAcc * 1.25, acc);
  vec3 col = mix(uBg, dotc, cov);
  // protagonist
  vec2 dq = rot(uDotRot) * (px - uDot.xy);
  dq /= uSquash;
  float dd = length(dq) - uDot.z;
  float daa = .8 / uScale / min(uSquash.x, uSquash.y);
  float dc = smoothstep(daa, -daa, dd);
  float glow = uDot.w * exp(-max(dd,0.) / 60.) * .6;
  col += uAcc * glow;
  col = mix(col, uAcc * (1. + uDot.w * .6), dc);
  fragColor = vec4(col, 1.);
}`;

  let fieldProg, dotsProg, fieldTarget;

  R.scenePoint = {
    CELL, EM, ORIGIN, TIT_R,
    center: [R.W / 2, R.H / 2],
    init() {
      fieldProg = new R.Program(FIELD_FS, 'point-field');
      dotsProg = new R.Program(DOTS_FS, 'point-dots');
      fieldTarget = new R.Target(GX, GY, { nearest: true });
    },
    // p: parameter block (see state())
    render(target, p, env) {
      R.draw(fieldProg, fieldTarget, {
        uT: p.t, uBoom: p.boom, uInvX: p.invX, uCollapse: p.collapse,
        uEm: EM, uCell: CELL, uDev: p.dev, uOrigin: ORIGIN, uCenter: this.center,
      });
      R.draw(dotsProg, target, {
        uField: fieldTarget.tex, uZoom: p.zoom, uFocus: p.focus, uCell: CELL, uT: p.t,
        uFront: Math.max(p.boom, 0) * 2900, uRefr: p.refr || 0, uZoomRot: p.zoomRot || 0, uCenter: this.center,
        uShake: env.shake, uBg: p.bg, uInk: p.ink, uAcc: p.acc,
        uDot: [p.dot[0], p.dot[1], p.dot[2], p.glow], uSquash: p.squash, uDotRot: p.dotRot || 0,
        uScale: env.scale, uJitter: env.jitter,
      });
    },
  };
})(window.REEL = window.REEL || {});
</script>
<script>/* src/scene-line.js */
/* scene-line.js — 1D. "A line is a dot that went for a walk" (Klee).
   The dot writes `line` as one continuous 5-strand ribbon, dots its own i,
   the ribbon is pulled taut into a musical staff, and the dot bounces down
   the staff like notes before the lines rush upward dragging the next plane. */
(function (R) {
  'use strict';
  const G = R.glyphs;
  const EM = 330;
  const TR = 0.13;
  const lx = { l: 0, i: G.W + TR, n: 2 * (G.W + TR), e: 2 * (G.W + TR) + 1 + TR };
  const WIDTH = lx.e + 1;
  const ORIGIN = [R.W / 2 - (WIDTH * EM) / 2, 700];  // baseline-left
  const c = G.W / 2, rr = 0.5 - c, f = 0.1;           // centreline offsets, ring radius, fillet

  // ---- path in em units (y up), sampled densely
  const pts = [];
  const push = (x, y) => pts.push([x, y]);
  function line(x0, y0, x1, y1, n = 24) { for (let i = 1; i <= n; i++) push(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n); }
  function arc(cx, cy, r, a0, a1, n = 24) { for (let i = 1; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; push(cx + r * Math.cos(a), cy + r * Math.sin(a)); } }
  function cubic(p0, p1, p2, p3, n = 30) {
    for (let i = 1; i <= n; i++) {
      const t = i / n, u = 1 - t;
      push(u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
        u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]);
    }
  }
  const PI = Math.PI;
  const xl = lx.l + c, xi = lx.i + c, xn0 = lx.n + c, xn1 = lx.n + 1 - c, ec = lx.e + 0.5;
  push(xl, 1.5);
  line(xl, 1.5, xl, f, 40);
  arc(xl + f, f, f, PI, 1.5 * PI, 10);
  line(xl + f, 0, xi - f, 0, 10);
  arc(xi - f, f, f, 1.5 * PI, 2 * PI, 10);
  line(xi, f, xi, 1, 30);
  line(xi, 1, xi, f, 30);               // retrace — strands nest into a paperclip cap
  arc(xi + f, f, f, PI, 1.5 * PI, 10);
  line(xi + f, 0, xn0 - f, 0, 10);
  arc(xn0 - f, f, f, 1.5 * PI, 2 * PI, 10);
  line(xn0, f, xn0, 0.5, 14);
  arc(lx.n + 0.5, 0.5, rr, PI, 0, 40);   // arch
  line(xn1, 0.5, xn1, f, 14);
  arc(xn1 + f, f, f, PI, 1.5 * PI, 10);
  cubic([xn1 + f, 0], [xn1 + f + 0.17, 0], [ec - rr - 0.16, 0.5], [ec - rr, 0.5], 30);
  line(ec - rr, 0.5, ec + rr, 0.5, 24);  // crossbar
  arc(ec, 0.5, rr, 0, (302 / 180) * PI, 90);
  // cumulative length
  const S = [0];
  for (let i = 1; i < pts.length; i++) S.push(S[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const LEN = S[S.length - 1];
  const toScr = (p) => [ORIGIN[0] + p[0] * EM, ORIGIN[1] - p[1] * EM];
  const SCR = pts.map(toScr);
  const TITTLE = toScr([xi, G.TIT.y + 0.02]);
  const START = SCR[0];
  const END = SCR[SCR.length - 1];

  // position at arc-length fraction u (0..1) along the written path
  function at(u) {
    const s = R.clamp(u) * LEN;
    let lo = 0, hi = S.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (S[m] < s) lo = m; else hi = m; }
    const k = (s - S[lo]) / Math.max(1e-9, S[hi] - S[lo]);
    return { i: lo, k, p: [SCR[lo][0] + (SCR[hi][0] - SCR[lo][0]) * k, SCR[lo][1] + (SCR[hi][1] - SCR[lo][1]) * k] };
  }

  const STRANDS = 5;
  function ribbon(ctx, poly, spacing, strandW, ink, paper) {
    // concentric strokes: alternating ink/paper widths produce perfect parallel strands
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const outer = (STRANDS - 1) * spacing + strandW;
    for (let k = 0; k < STRANDS; k++) {
      const wInk = outer - 2 * k * spacing;
      const wGap = wInk - 2 * strandW;
      ctx.beginPath();
      ctx.moveTo(poly[0][0], poly[0][1]);
      for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
      ctx.strokeStyle = ink; ctx.lineWidth = wInk; ctx.stroke();
      if (wGap > 0.5) { ctx.strokeStyle = paper; ctx.lineWidth = wGap; ctx.stroke(); }
    }
  }

  let canvas, ctx, tex;
  R.sceneLine = {
    EM, ORIGIN, START, END, TITTLE, LEN, SCR, S, at,
    init() { this.resize(); },
    resize() {
      canvas = R.canvas2d(Math.round(R.W * R.scale), Math.round(R.H * R.scale));
      ctx = canvas.getContext('2d');
      if (tex) R.gl.deleteTexture(tex.tex);
      tex = new R.CanvasTex(canvas);
    },
    render(target, p, env) {
      const s = env.scale;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = R.rgba(p.paper); ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(s, 0, 0, s, 0, 0);
      ctx.translate(R.W / 2 + env.shake[0], R.H / 2 + env.shake[1]);
      ctx.rotate(env.shake[2]);
      ctx.translate(-R.W / 2, -R.H / 2);
      const ink = R.rgba(p.ink), paper = R.rgba(p.paper);

      if (p.mode === 'write') {
        // written portion of the path, optionally morphing toward a straight line
        const head = at(p.write);
        const n = head.i + 1;
        const poly = new Array(n + 1);
        for (let i = 0; i < n; i++) poly[i] = SCR[i];
        poly[n] = head.p;
        if (p.pull > 0) {
          for (let i = 0; i <= n; i++) {
            const si = i < n ? S[i] : head.k;
            const u = (i < n ? S[i] : S[head.i]) / LEN;
            const edge = Math.abs(2 * u - 1);             // 1 at the ends, 0 in the middle
            const d = (1 - edge) * 0.45;
            const k = R.E.inOutCubic(R.clamp((p.pull - d) / (1 - 0.45)));
            const sx = R.W / 2 + (u - 0.5) * LEN * EM * p.stretch;
            poly[i] = [R.lerp(poly[i][0], sx, k), R.lerp(poly[i][1], p.lineY, k)];
          }
        }
        ribbon(ctx, poly, p.spacing, p.strandW, ink, paper);
      } else if (p.mode === 'staff') {
        ctx.lineCap = 'butt';
        for (let k = 0; k < STRANDS; k++) {
          const y0 = p.lineY + (k - 2) * p.spacing - p.lift[k];
          ctx.beginPath();
          for (let x = -40; x <= R.W + 40; x += 12) {
            let y = y0;
            for (const dfl of p.deflect) if (dfl.k === k) y += dfl.a * Math.exp(-Math.pow((x - dfl.x) / dfl.w, 2)) + dfl.v * Math.sin((x - dfl.x) / dfl.w * 2.2) * Math.exp(-Math.pow((x - dfl.x) / (dfl.w * 3), 2));
            if (x === -40) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = ink; ctx.lineWidth = p.strandW; ctx.stroke();
          if (p.curtain && k === p.curtain.k) {
            ctx.lineTo(R.W + 40, R.H + 40); ctx.lineTo(-40, R.H + 40); ctx.closePath();
            ctx.fillStyle = R.rgba(p.curtain.color); ctx.fill();
            ctx.stroke();
          }
        }
      }
      // the dot
      if (p.dot) {
        const [x, y, r] = p.dot;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(p.dotRot || 0);
        ctx.scale(p.squash[0], p.squash[1]);
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = R.rgba(p.acc); ctx.fill();
        ctx.restore();
      }
      tex.upload();
      R.draw(R.blitProg, target, { uTex: tex, uAlpha: 1 });
    },
  };
})(window.REEL = window.REEL || {});
</script>
<script>/* src/scene-world.js */
/* scene-world.js — 2D, 3D and 4D share one raymarched world.
   The "flat" plane chapter is the same scene seen top-down through a camera
   so far away it is effectively orthographic; tilting and dollying in turns
   the paper cut-outs into solids (a dolly-zoom from infinity). Time effects
   (slit-scan, Harris-shutter RGB, chronophotography) evaluate the procedural
   motion at a different time per pixel / per channel.

   Software GL predicates branches, so the SDF is generated per "cast"
   (which glyphs occupy which slot) with every glyph unrolled. */
(function (R) {
  'use strict';
  const G = R.glyphs;
  const MAXP = 5, SLOTS = 6;
  const IDS = { p: 1, l: 2, a: 3, n: 4, e: 5, v: 6, o: 7, u: 8, m: 9, t: 10, i: 11 };
  R.GLYPH_ID = IDS;

  // slot casts: each slot lists up to two glyphs (A, B), chosen by uSlotSel
  const CASTS = {
    plane: ['p', 'l', 'a', 'n', 'e', ''],
    flip: ['p/v', 'l', 'a/l', 'n/u', 'e/m', 'e'],
    volume: ['v', '', 'l', 'u', 'm', 'e'],
    swap: ['v/t', 'i', 'l', 'u', 'm', 'e'],
    time: ['t', 'i', '', '', 'm', 'e'],
  };

  function pivot(pt) { return pt.c || [0.5, 0.5]; }
  function glyphCode(ch, s) {
    const g = G.L[ch];
    let c = '';
    g.parts.forEach((pt, j) => {
      const k = s * MAXP + j;
      c += `      r = pxf(g2, ${k}, ${G.v2(pivot(pt))}); dd = ${G.partExpr(pt, 'r')} * uPartS[${k}]; if (dd < d2) { d2 = dd; if (bp < 1.) pj = ${j}; } if (dd < .003 && uPartPrio[${k}] > bp) { bp = uPartPrio[${k}]; pj = ${j}; }\n`;
    });
    return c;
  }
  function mapCode(cast, ghosts) {
    let s = '';
    const active = [];
    cast.forEach((spec, si) => {
      if (!spec) return;
      active.push(si);
      const [A, Bg] = spec.split('/');
      s += `float slot${si}(vec3 p, float tau, out int pj){
  vec3 q = slotLocal(p, ${si}, tau);
  vec3 bq = abs(q - vec3(0., .5, 0.)) - uSlotBox[${si}];
  float db = (length(max(bq, 0.)) + min(max(bq.x, max(bq.y, bq.z)), 0.)) * uSlotMinS[${si}];
  pj = -1;
  if (db > .08) return db;
  vec2 g2 = vec2(q.x + uSlotAdv[${si}] * .5, q.y), r;
  float d2 = 1e5, dd, bp = 0.; pj = 0;
`;
      if (Bg) s += `  if (uSlotSel[${si}] < .5) {\n${glyphCode(A, si)}  } else {\n${glyphCode(Bg, si)}  }\n`;
      else s += glyphCode(A, si);
      s += `  return extrude(d2, q.z, uSlotDepth[${si}], min(uRound, uSlotDepth[${si}] * .8)) * uSlotMinS[${si}];
}
`;
    });
    s += `float mapFull(vec3 p, float tau, out int id, out int sub){
  float d = 1e5, dd; int pj; id = -1; sub = 0;
`;
    for (const si of active) {
      s += `  if (uSlotB[${si}].w > 0.) { dd = slot${si}(p, tau, pj); if (dd < d) { d = dd; id = pj < 0 ? -2 : 1; sub = ${si * MAXP} + max(pj, 0); } }\n`;
    }
    s += `  vec3 dc = dotAt(tau);
  dd = sdDot(p - dc);
  if (dd < d) { d = dd; id = 2; }
`;
    if (ghosts) {
      s += `  for (int k = 1; k <= 6; k++) {
    vec3 gc = dotAt(tau - float(k) * uGhostDt);
    dd = length(p - gc) - uDotShape.x * (1. - float(k) * .11);
    if (dd < d) { d = dd; id = 3; sub = k; }
  }
`;
    }
    s += '  return d;\n}\n';
    // single-surface distance for normals
    s += `float surfDist(vec3 p, float tau, int id, int sub){
  int pj;
  if (id == 2) return sdDot(p - dotAt(tau));
`;
    if (ghosts) s += `  if (id == 3) return length(p - dotAt(tau - float(sub) * uGhostDt)) - uDotShape.x * (1. - float(sub) * .11);\n`;
    s += `  int s = sub / ${MAXP};\n`;
    for (const si of active) s += `  if (s == ${si}) return slot${si}(p, tau, pj);\n`;
    s += `  return 1e5;\n}\n`;
    return s;
  }

  const HEAD = R.GLSL + G.GLSL_SDF2 + `
uniform vec3 uCamPos, uCamF, uCamR, uCamU;
uniform float uFocal, uPixAng, uDbg, uSunOn;
uniform float uSlotSel[${SLOTS}];
uniform vec3 uSlotPos[${SLOTS}];
uniform mat3 uSlotM[${SLOTS}];
uniform vec3 uSlotScl[${SLOTS}];
uniform float uSlotMinS[${SLOTS}];
uniform vec3 uSlotBox[${SLOTS}];
uniform float uSlotAdv[${SLOTS}];
uniform float uSlotDepth[${SLOTS}];
uniform vec4 uSlotB[${SLOTS}];
uniform vec4 uPart[${SLOTS * MAXP}];
uniform float uPartS[${SLOTS * MAXP}];
uniform float uPartPrio[${SLOTS * MAXP}];
uniform vec3 uBoxMin, uBoxMax;
uniform float uPartCol[${SLOTS * MAXP}];
uniform vec3 uPal[6];
uniform vec3 uDotC, uDotShape, uDotScl;
uniform float uDotEmit, uDotSpec;
uniform vec3 uSunDir, uSunCol, uSkyCol, uBgTop, uBgBot, uRimCol;
uniform float uAmb, uShadowK, uSpec, uFog, uFogStart, uRound, uGloss;
uniform float uTau, uSpin, uSlit, uRGB, uBob, uGhostDt, uTone, uExpo, uDotGlow;
uniform vec3 uShake;
uniform int uZero;
#define ZERO min(uZero, 0)

float extrude(float d2, float z, float h, float r){ vec2 w = vec2(d2 + r, abs(z) - h + r); return min(max(w.x,w.y),0.) + length(max(w,0.)) - r; }
vec2 r2(vec2 v, float a){ float c=cos(a), s=sin(a); return vec2(c*v.x - s*v.y, s*v.x + c*v.y); }
vec2 pxf(vec2 q, int k, vec2 pv){ vec4 T = uPart[k]; vec2 v = q - T.xy - pv; return vec2(T.z*v.x - T.w*v.y, T.w*v.x + T.z*v.y) / uPartS[k] + pv; }
float sdEllipsoid(vec3 p, vec3 r){ float k0 = length(p/r); float k1 = length(p/(r*r)); return k0*(k0-1.0)/max(k1, 1e-6); }
// the dot: a rounded cylinder that morphs flat disc (R>>rb) <-> sphere (R==rb)
float sdDot(vec3 p){
  vec3 q = p / uDotScl;
  vec2 d = vec2(length(q.xz) - (uDotShape.x - uDotShape.y), abs(q.y) - uDotShape.z);
  return (min(max(d.x, d.y), 0.) + length(max(d, 0.)) - uDotShape.y) * min(uDotScl.x, min(uDotScl.y, uDotScl.z));
}

// procedural motion (drives the 4D chapter; zero elsewhere)
float spinOf(int s, float tau){ return uSpin * (sin(tau * 3.1 + float(s) * .9) * 1.2 + tau * 1.7); }
// one bounce per beat; a 1:2 Lissajous sway makes the ghost trail a figure-eight
vec3 dotAt(float tau){ float w = tau * 3.14159265 * 2.1333; return uDotC + vec3(uBob * .55 * sin(2. * w), uBob * abs(sin(w)), 0.); }
vec3 slotLocal(vec3 p, int s, float tau){
  vec3 q = p - uSlotPos[s];
#ifdef PROC_SPIN
  q.xz = r2(q.xz, -spinOf(s, tau));
#endif
  return (uSlotM[s] * q) / uSlotScl[s];
}
`;

  const TAIL = `
float map(vec3 p, float tau){ int a, b; return mapFull(p, tau, a, b); }
// distance usable for shading: bounding proxies report "far"
float mapS(vec3 p, float tau, out bool proxy){ int a, b; float d = mapFull(p, tau, a, b); proxy = a == -2; return d; }
vec2 boxHit(vec3 ro, vec3 rd){
  vec3 inv = 1. / rd;
  vec3 t0 = (uBoxMin - ro) * inv, t1 = (uBoxMax - ro) * inv;
  vec3 tn = min(t0, t1), tf = max(t0, t1);

        }

      ctx.fillText(`128 BPM   ${pad(Math.floor(beat / 4) + 1)}.${inBar + 1}`, sx - 4 * (sq + gap) - 10, bot);

<script>/* src/timeline.js */
/* timeline.js — the beat sheet. 128 BPM, 32 beats, 15.000 s.
   Every event below is expressed in beats; R.b(n) converts to seconds. */
(function (R) {
  'use strict';
  const E = R.E, b = R.b, lerp = R.lerp, inv = R.inv;
  const P = R.palette = {
    ink: R.hex('#0B0B0C'),
    paper: R.hex('#F1EEE7'),
    orange: R.hex('#FF4D17'),
    blue: R.hex('#2536FF'),
  };
  R.SCENES = ['scenePoint', 'sceneLine', 'sceneWorld', 'sceneWords', 'sceneFinale', 'climax'];
  const PEN_R = 17;
  R.PEN_R = PEN_R;

  // ------------------------------------------------------------ camera shake
  const HITS = [ // [beat, amplitude px, decay]
    [0.25, 16, 9], [3, 7, 12], [5, 4, 16], [8, 2.5, 18], [8.25, 2, 18], [8.5, 2, 18], [8.75, 2, 18],
    [10, 3, 14], [13.1, 5, 12], [16, 6, 10], [19, 3, 14], [23, 5, 14], [24, 4, 16], [25, 4, 16], [26, 5, 16], [28, 7, 11],
  ];
  const n1 = (x) => Math.sin(x * 1.7) * 0.6 + Math.sin(x * 3.1 + 1.3) * 0.3 + Math.sin(x * 7.3 + 2.1) * 0.1;
  R.shakeAt = function (t) {
    let a = 0;
    for (const [bt, amp, dec] of HITS) a += amp * R.kick(t, bt, dec);
    return [a * n1(t * 60), a * n1(t * 60 + 17.3), a * 0.0012 * n1(t * 45 + 5.1)];
  };

  // ------------------------------------------------------------ lens / post
  R.lensAt = function (t) {
    const B = t / R.BEAT;
    const impact = (bt, n = 2) => (t >= b(bt) && t < b(bt) + n / R.FPS ? 1 : 0);
    const ch = B < 5 ? 'point' : B < 9 ? 'line' : B < 12 ? 'plane' : B < 19 ? 'volume' : B < 23 ? 'time' : B < 27 ? 'climax' : 'end';
    const base = { point: 0.0012, line: 0.0006, plane: 0.0007, volume: 0.001, time: 0.0028, climax: 0.0045, end: 0 }[ch];
    const light = ch === 'line' || (ch === 'climax' && false);
    return {
      ca: base + 0.016 * R.kick(t, 0.25, 12) + 0.008 * R.kick(t, 3, 10) + 0.012 * R.kick(t, 16, 9) + 0.01 * R.kick(t, 28, 12)
        + (ch === 'climax' ? 0.006 * R.pb(t, 23, 27) : 0),
      invert: impact(0.25, 2) || impact(16, 1) || impact(26.99, 1),
      flash: [1, 1, 1, 0.9 * impact(21, 1)],
      bloom: ch === 'end' ? 0.35 : 0.55,
      grain: light ? 0.035 : ch === 'end' ? 0.03 : 0.045,
      vig: light ? 0.1 : ch === 'plane' || ch === 'volume' ? 0.16 : 0.28,
    };
  };

  // HUD: colour follows the ground; the timecode obeys the time chapter's clock
  R.hudState = function (t) {
    const B = t / R.BEAT;
    if (B >= 27) return { alpha: 0 };
    const st = { alpha: 0.78, color: P.paper };
    if (B < 0.25) st.alpha = 0;
    else if (B < 0.6) st.alpha = 0.78 * R.pb(t, 0.25, 0.6);
    if (B >= 5 && B < 9) st.color = P.ink;
    if (B >= 19 && B < 23) {
      const w = R.worldState(t);
      st.tc = b(19) + w.fx.tau;
    }
    if (B >= 23) {
      const i = R.climax.cutAt(t);
      const [, kind, o] = R.CUTS[i];
      const bg = o.bg || o.paper || o.floor || (kind === 'line' ? P.paper : kind === 'point' ? P.ink : kind === 'time' ? P.ink : P.blue);
      const lum = 0.3 * bg[0] + 0.59 * bg[1] + 0.11 * bg[2];
      st.color = lum > 0.6 ? P.ink : P.paper;
      const c = R.climax.chapterAt(t);

  };

  // ------------------------------------------------------------ 0D point
  function pointState(t) {
    const SP = R.scenePoint;
    const p = { t, bg: P.ink, ink: P.paper, acc: P.orange, dev: 1 };
    p.boom = t - b(0.25);
    p.invX = t < b(2) ? -1e5 : lerp(-250, 2250, R.pb(t, 2, 2.6, E.inOutCubic));
    p.refr = 34 * Math.exp(-Math.max(0, t - b(0.25)) * 3.5);
    const zIn = R.pb(t, 3, 3.5, E.outExpo);
    const zOut = R.pb(t, 4, 4.75, E.inOutCubic);
    p.zoom = 1 + 1.6 * zIn * (1 - zOut);
    p.focus = SP.center;
    p.zoomRot = -0.12 * zIn * (1 - zOut);
    p.collapse = t < b(4) ? 1e5 : lerp(2300, -80, R.pb(t, 4, 4.7, E.inCubic));

    let r, sq = [1, 1], glow = 0;
    const hit = b(0.25);
    if (t < hit) {
      const u = E.inCubic(inv(0, hit, t));
      r = lerp(20, 27, u);
      sq = [1 + 0.32 * u, 1 - 0.26 * u];
    } else {
      const dt = t - hit;
      r = lerp(27, SP.TIT_R, E.spring(dt * 1.15, 3.2, 7.5));
      const k = R.ring(t, 0.25, 3.4, 8);

      glow = 1.6 * Math.exp(-dt * 7);
    }

    r *= p.zoom;

    const s = R.pb(t, 4.1, 4.75, E.inOutCubic);
    r = lerp(r, PEN_R, s);
    glow += 0.8 * Math.sin(Math.PI * R.pb(t, 4.3, 4.8));

    const hp = R.pb(t, 4.45, 5, E.inOutSine);

      const st = R.sceneLine.START;
      pos = [lerp(SP.center[0], st[0], hp), lerp(SP.center[1], st[1], hp) - 190 * R.hop(hp)];
      const v = Math.sin(Math.PI * hp);
      sq = [1 - 0.18 * v, 1 + 0.22 * v];

    p.squash = sq;
    p.glow = glow;
    return p;
  }

  R.pointState = pointState;

  // ------------------------------------------------------------ 1D line
  const WRITE = E.bezier(0.42, 0.0, 0.22, 1);
  function lineState(t) {
    const SL = R.sceneLine;
    const p = { paper: P.paper, ink: P.ink, acc: P.orange, spacing: 8.5, strandW: 4.5, squash: [1, 1], lineY: 540, stretch: 1.35 };
    const wr = WRITE(inv(b(5), b(6.5), t));
    p.write = wr;
    p.pull = R.pb(t, 7, 7.5);
    p.mode = t < b(7.5) ? 'write' : 'staff';
    let r = PEN_R, pos, sq = [1, 1], rotA = 0;
    if (t < b(6.5)) {
      const h = SL.at(wr).p, h0 = SL.at(Math.max(0, wr - 0.004)).p;
      const vx = h[0] - h0[0], vy = h[1] - h0[1], sp = Math.hypot(vx, vy);
      pos = h; rotA = Math.atan2(vy, vx);
      const st = Math.min(0.5, sp * 0.02);
      sq = [1 + st, 1 / (1 + st)];
      // landing squash at the start
      const land = R.kick(t, 5, 16);
      sq = [sq[0] * (1 + 0.35 * land), sq[1] * (1 - 0.3 * land)];
    } else if (t < b(7)) {
      // pen lifts and dots the i
      const u = R.pb(t, 6.5, 7, E.inOutSine);
      pos = [lerp(SL.END[0], SL.TITTLE[0], u), lerp(SL.END[1], SL.TITTLE[1], u) - 230 * R.hop(u)];
      r = lerp(PEN_R, 25, u);
      const v = Math.sin(Math.PI * u);
      sq = [1 - 0.15 * v, 1 + 0.2 * v];
    } else {
      pos = SL.TITTLE.slice(); r = 25;
      const land = R.ring(t, 7, 5, 9);
      sq = [1 + 0.3 * land, 1 - 0.3 * land];
    }
    // staff: strands fan out into five lines
    const sep = R.pb(t, 7.3, 7.85, E.outBack);
    p.spacing = lerp(8.5, 64, sep);
    // bounce choreography (after the i vanishes, the dot hangs... then drops)
    const lineYk = (k) => p.lineY + (k - 2) * p.spacing;
    const hits = [[8, 0], [8.25, 1], [8.5, 2], [8.75, 3]];
    const x0 = SL.TITTLE[0], dx = 118;
    p.deflect = [];
    if (t >= b(7.4)) {
      if (t < b(8)) {
        const u = inv(b(7.4), b(8), t);
        pos = [x0, lerp(SL.TITTLE[1], lineYk(0) - r, u * u)];
        sq = [1 - 0.12 * u * u, 1 + 0.18 * u * u];
      } else {
        let i = 0; while (i < hits.length - 1 && t >= b(hits[i + 1][0])) i++;
        const [hb, k] = hits[i];
        const u = inv(b(hb), b(hb + 0.25), t);
        const xa = x0 + i * dx, xb = x0 + (i + 1) * dx;
        const ya = lineYk(k) - r;
        const yb = i < hits.length - 1 ? lineYk(hits[i + 1][1]) - r : -300;
        const peak = i < hits.length - 1 ? 60 : 0;
        if (i < hits.length - 1) pos = [lerp(xa, xb, u), lerp(ya, yb, u) - (peak + 0.5 * Math.abs(yb - ya)) * R.hop(u) * 1.0 + (yb - ya) * 0];
        else pos = [lerp(xa, xa + 260, u), lerp(ya, yb, E.outCubic(u))];
        const land = R.kick(t, hb, 22);
        sq = [1 + 0.38 * land, 1 - 0.34 * land];
      }
      for (let i = 0; i < hits.length; i++) {
        const [hb, k] = hits[i];
        const dt = t - b(hb);
        if (dt < 0) continue;
        const env = Math.exp(-dt * 7);
        p.deflect.push({ k, x: x0 + i * dx, w: 95, a: 24 * env * Math.cos(dt * Math.PI * 2 * 6.5), v: 6 * env * Math.sin(dt * 40) });
      }
    }
    // lines rush upward, the last one dragging the blue plane
    p.lift = [0, 0, 0, 0, 0];
    for (let k = 0; k < 5; k++) {
      const u = R.ps(t, b(8.72) + k * 0.018, b(9) - (4 - k) * 0.004, E.inCubic);
      p.lift[k] = u * (lineYk(k) + 80);
    }
    if (t >= b(8.72)) p.curtain = { k: 4, color: P.blue };
    p.dot = [pos[0], pos[1], r];
    p.squash = sq; p.dotRot = rotA;

    if (t < b(9)) { R.sceneLine.render(target, lineState(t), env); return; }
    if (t < b(23)) { R.sceneWorld.render(target, R.worldState(t), env); return; }
    if (t < b(27)) { R.climax.render(t, target, env); return; }
    R.sceneFinale.render(target, R.finaleState(t), env);
  };
})(window.REEL = window.REEL || {});

<script>/* src/timeline-world.js */
/* timeline-world.js — choreography for 2D plane, 3D volume and 4D time. */
(function (R) {
  'use strict';
  const E = R.E, b = R.b, lerp = R.lerp, inv = R.inv, clamp = R.clamp;
  const G = R.glyphs, ID = R.GLYPH_ID;
  const lin = (c) => c.map((v) => Math.pow(v, 2.2));
  const mix3 = (a, c, k) => [lerp(a[0], c[0], k), lerp(a[1], c[1], k), lerp(a[2], c[2], k)];

  const D_FLAT = 0.012, D_VOL = 0.26;
  const LAY = { plane: R.worldLayout('plane'), volume: R.worldLayout('volume'), time: R.worldLayout('time') };
  // part colour indices: 0 cream, 1 ink, 2 orange, 3 blue
  const COLS = {
    p: [1, 0], l: [0], a: [0, 0], n: [0, 0, 0], e: [0, 1],
    v: [0], o: [0], u: [0, 0, 0], m: [0, 0, 1, 0, 0], t: [0, 0], i: [0],
  };

  // keyframe interpolation: ks = [[beat, value, easeToNext?], ...]
  function kf(t, ks) {
    const B = t / R.BEAT;
    if (B <= ks[0][0]) return ks[0][1];
    for (let i = 0; i < ks.length - 1; i++) {
      const [b0, v0, e] = ks[i], [b1, v1] = ks[i + 1];
      if (B <= b1) {
        const u = (e || E.inOutCubic)((B - b0) / (b1 - b0));
        return Array.isArray(v0) ? v0.map((x, j) => lerp(x, v1[j], u)) : lerp(v0, v1, u);
      }
    }
    return ks[ks.length - 1][1];
  }
  R.kf = kf;

  function mkSlot(ch, cx) {
    const g = G.L[ch];
    return {
      g: ID[ch] || 0, ch, pos: [cx, 0, 0], rot: [0, 0, 0], scl: [1, 1, 1], adv: g ? g.adv : 1, depth: D_VOL,
      parts: (g ? g.parts : [0]).map(() => [0, 0, 0, 1]), cols: COLS[ch] || [0],
    };
  }

  // deterministic fly-in vectors for the paper parts
  function flyIn(ch, j, part, slotIdx) {
    const h = R.hash(slotIdx * 7.31 + j * 3.17);
    const tall = part.t === 'box' && part.h[1] > part.h[0];
    const wide = part.t === 'box' && part.h[0] > part.h[1];
    if (tall) return [0, (h > 0.5 ? 1 : -1) * 4.2, (h - 0.5) * 0.6, 1];
    if (wide) return [(h > 0.5 ? 1 : -1) * 6.5, 0, (h - 0.5) * 0.5, 1];
    return [(slotIdx < 2 ? -1 : 1) * 5.5, (h - 0.5) * 3, (h > 0.5 ? 1 : -1) * 2.4, 0.4];
  }

  const PAL_BASE = () => [lin(R.palette.paper), lin([0.075, 0.075, 0.085]), lin(R.palette.orange), lin(R.palette.blue), lin(R.palette.blue), lin([0.5, 0.5, 0.5])];

  function worldState(t) {
    const B = t / R.BEAT;
    const st = { slots: [], fx: {}, pal: PAL_BASE() };
    st.cast = B < 13 ? 'plane' : B < 14.35 ? 'flip' : B < 17.85 ? 'volume' : B < 19 ? 'swap' : 'time';

    // ---------------------------------------------------------------- letters
    // phase A (b9..b13): "plane" lying flat, parts fly in, then pop up
    // phase B (b13..b18): flip-swap into "volume", 3D choreography
    // phase C (b18..b23): "volume" -> "time"
    const pop = (i) => R.pb(t, 12 + i * 0.1, 13.0 + i * 0.1, E.outBack);
    const depthK = R.pb(t, 12.05, 13.1, E.inOutCubic);
    const depth = lerp(D_FLAT, D_VOL, depthK);
    const slots = [];
    for (let s = 0; s < 6; s++) {
      const from = LAY.plane[s], to = LAY.volume[s];
      // flip-swap timing (b13.0 .. b14.0)
      const f0 = 13.0 + s * 0.12, f1 = f0 + 0.55;
      const fu = clamp((B - f0) / (f1 - f0));
      const fe = E.inOutCubic(fu);
      const swapped = fu >= 0.5;
      const ch = swapped ? to.ch : (from ? from.ch : null);
      const cx = lerp(from ? from.cx : to.cx, to.cx, fe);
      let sl = ch && ch !== 'o' ? mkSlot(ch, cx) : { ch: null, pos: [cx, 0, 0], rot: [0, 0, 0], scl: [1, 1, 1], adv: 1, depth, parts: [], cols: [0] };
      sl.depth = depth;
      // flat (hinge -90deg) -> standing
      const hk = pop(s);
      sl.rot[0] = lerp(-Math.PI / 2, 0, hk);
      const standY = from && from.ch === 'p' ? 0.5 * (1 - fe) : 0;   // the p stands on its descender
      sl.pos[1] = lerp(depth + 0.035, standY, clamp(hk));
      // flip
      if (fu > 0 && fu < 1) sl.rot[1] = swapped ? lerp(-Math.PI / 2, 0, E.outBack((fu - 0.5) * 2, 1.4)) : lerp(0, Math.PI / 2, E.inCubic(fu * 2));
      // slot 5 ('e' of volume) has no plane letter: it springs up out of the floor
      if (s === 5) {
        sl = mkSlot('e', to.cx);
        sl.depth = depth;
        const u = R.pb(t, 13.7, 14.25, E.outBack);
        sl.pos[1] = lerp(-1.7, 0, u);
        if (B < 13.7) sl.ch = null;
      }
      // paper parts fly in (b9.4 .. b10)
      if (from && !swapped) {
        const g = G.L[from.ch];
        g.parts.forEach((pt, j) => {
          const land = 9.45 + (s * 0.09 + j * 0.05);
          const u = clamp((B - (land - 0.42)) / 0.42);
          const k = 1 - E.outExpo(u);
          const v = flyIn(from.ch, j, pt, s);
          sl.parts[j] = [v[0] * k, v[1] * k, v[2] * k, lerp(1, v[3], k)];

      }
      slots.push(sl);
    }

    // --- b10.5 / b11 / b11.5: the flat composition breathes (tracking out, in, home)
    const trk = kf(t, [[10.45, 0], [10.72, 0.34, E.outBack], [10.95, 0.34], [11.2, -0.07, E.snap], [11.45, -0.07], [11.8, 0, E.snap]]);
    if (B < 12.2) slots.forEach((sl, s) => { if (s < 5) sl.pos[0] += (s - 2) * trk; });

    // --- volume choreography: stadium wave (b16.25..b17.5)
    if (B > 16 && B < 18) {
      slots.forEach((sl, s) => {
        const u = clamp((B - 16.4 - s * 0.14) / 0.62);
        if (u <= 0 || u >= 1) return;
        const jump = Math.sin(Math.PI * u);
        const sq = u < 0.12 ? -Math.sin(Math.PI * u / 0.12) * 0.25 : (u > 0.88 ? -Math.sin(Math.PI * (u - 0.88) / 0.12) * 0.22 : jump * 0.12);
        sl.pos[1] += 0.9 * jump * jump * (u > 0.12 && u < 0.88 ? 1 : 0.4);
        sl.scl = [sl.scl[0] * (1 - sq * 0.6), sl.scl[1] * (1 + sq), sl.scl[2] * (1 - sq * 0.6)];
        sl.rot[1] += jump * 0.35 * (s % 2 ? 1 : -1);
      });
    }

    if (B >= 17.9) {
      const TT = LAY.time;
      for (let s = 0; s < 6; s++) {
        const sl = slots[s];
        if (s >= 4) {                                 // m, e slide left into place
          const u = R.pb(t, 18.1, 18.8, E.snap);
          sl.pos[0] = lerp(LAY.volume[s].cx, TT[s - 2].cx, u);
        } else {                                       // v o l u drop through the floor...
          const u = R.pb(t, 17.9 + s * 0.07, 18.35 + s * 0.07, E.inBack);
          sl.pos[1] -= 2.2 * u;
          sl.rot[2] += (s - 1.5) * 0.25 * u;
          // ...and t, i rise out of it
          if (s < 2) {
            const r = R.pb(t, 18.45 + s * 0.1, 18.95 + s * 0.1, E.outBack);
            if (r > 0) {
              const ns = mkSlot(TT[s].ch, TT[s].cx);
              ns.depth = D_VOL;
              ns.pos[1] = lerp(-1.8, 0, r);
              ns.scl = [1, lerp(0.6, 1, r), 1];
              slots[s] = ns;
            }
          } else if (u >= 1) sl.ch = null;
        }
      }
    }
    st.slots = slots;

    // ---------------------------------------------------------------- the dot
    // falls into the paper world (b9..b9.3), splats into a disc, inflates to a sphere (b13..b14),
    // becomes the o of volume, then hops onto the i of time (b18.3..b19)
    const DISC = [0.35, 0, -0.55];
    const TH = 0.012;                     // paper thickness of the disc
    let c, R0, rb, scl = [1, 1, 1];
    {
      const fall = R.pb(t, 8.95, 9.3, E.inQuad);
      const splat = R.pb(t, 9.3, 9.9, (x) => E.spring(x, 2.2, 5.5));
      const flatR = lerp(0.12, 1.45, splat) * (st.discK || 1);
      const ball = 1 - R.pb(t, 9.28, 9.4);          // falls as a ball, lands as paper
