<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Point Made</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #0B0B0C;
    --ink-2: #151517;
    --line: #2a2a2e;
    --paper: #F1EEE7;
    --dim: #8f8b82;
    --orange: #FF4D17;
    --blue: #2536FF;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--paper);
    font: 12px/1.45 'Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    letter-spacing: .06em; text-transform: uppercase;
    display: grid; place-items: center; padding-inline: 16px; padding-block: 20px; box-sizing: border-box;
  }
  .wrap { width: min(100%, 1280px, calc((100vh - 170px) * 16 / 9)); min-width: min(100%, 320px); display: grid; gap: 14px; }
  header, .bar { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header b { font-weight: 600; color: var(--paper); }
  header span, .bar span { color: var(--dim); }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .veil { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(11,11,12,.72); border: 0; color: var(--paper);
          font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
  .veil[hidden] { display: none; }
  .veil i { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--orange); margin: 0 auto 10px; }
  .tl { position: relative; height: 46px; cursor: pointer; user-select: none; touch-action: none; }
  .tl .seg { position: absolute; top: 0; height: 18px; border-left: 1px solid var(--line); padding-left: 6px; color: var(--dim); white-space: nowrap; overflow: hidden; box-sizing: border-box; }
  .tl .seg.on { color: var(--paper); }
  .tl .seg em { font-style: normal; color: var(--orange); margin-right: 6px; }
  .tl .rail { position: absolute; left: 0; right: 0; top: 26px; height: 14px; }
  .tl .tick { position: absolute; top: 4px; width: 1px; height: 6px; background: var(--line); }
  .tl .tick.bar { top: 0; height: 14px; background: #4a4a50; }
  .tl .fill { position: absolute; left: 0; top: 6px; height: 2px; background: var(--paper); opacity: .35; }
  .tl .head { position: absolute; top: -4px; width: 2px; height: 22px; background: var(--orange); transform: translateX(-1px); }
  button.play { background: none; border: 1px solid var(--line); color: var(--paper); font: inherit; letter-spacing: inherit; text-transform: inherit;
                padding: 6px 12px; cursor: pointer; min-width: 84px; }
  button.play:focus-visible, .tl:focus-visible, .veil:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .readout { font-variant-numeric: tabular-nums; }
  .keys { color: var(--dim); }
  @media (max-width: 640px) { .tl .seg .nm { display: none; } .keys { display: none; } }
  body.capture { display: block; padding: 0; }
  body.capture .wrap { width: 1920px; min-width: 0; display: block; }
  body.capture header, body.capture .tl, body.capture .bar, body.capture .veil { display: none; }
  body.capture .stage { aspect-ratio: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <b>Point made.</b>
    <span>a 15-second motion reel · 0D → 4D · rendered live in WebGL2</span>
  </header>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="Motion reel: a dot becomes a line, a plane, a volume and time, then returns as the full stop of the sentence 'point made.'"></canvas>
    <button class="veil" id="veil" hidden><span><i></i>Play reel<br><span style="color:var(--dim)">contains rapid cuts and flashes</span></span></button>
  </div>
  <div class="tl" id="tl" tabindex="0" role="slider" aria-label="Timeline" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0"></div>
  <div class="bar">
    <div class="controls">
      <button class="play" id="play" type="button">Pause</button>
      <span class="readout" id="readout">00:00:00 · bar 1.1</span>
    </div>
    <span class="keys">space play · ← → frame · [ ] beat</span>
  </div>
</div>
<!--REEL:SCRIPTS-->
<script src="src/core.js"></script>
<script src="src/glyphs.js"></script>
<script src="src/fonts.js"></script>
<script src="src/post.js"></script>
<script src="src/scene-point.js"></script>
<script src="src/scene-line.js"></script>
<script src="src/scene-world.js"></script>
<script src="src/scene-words.js"></script>
<script src="src/scene-finale.js"></script>
<script src="src/hud.js"></script>
<script src="src/timeline.js"></script>
<script src="src/timeline-world.js"></script>
<script src="src/timeline-climax.js"></script>
<script src="src/main.js"></script>
<!--/REEL:SCRIPTS-->
<script>
(async function () {
  const R = window.REEL;
  const q = (() => { try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(''); } })();
  const capture = q.has('capture');
  if (capture) document.body.classList.add('capture');
  const canvas = document.getElementById('c');

  // --- timeline markup: chapters + the 32-beat grid
  const CH = [[0, 5, '0D', 'point'], [5, 9, '1D', 'line'], [9, 12, '2D', 'plane'], [12, 19, '3D', 'volume'], [19, 23, '4D', 'time'], [23, 27, '∑', 'all'], [27, 32, '.', 'made']];
  const tl = document.getElementById('tl');
  const segs = CH.map(([a, b, n, name]) => {
    const d = document.createElement('div');
    d.className = 'seg';
    d.style.left = (100 * a / 32) + '%'; d.style.width = (100 * (b - a) / 32) + '%';
    d.innerHTML = `<em>${n}</em><span class="nm">${name}</span>`;
    tl.appendChild(d); return d;
  });
  const rail = document.createElement('div'); rail.className = 'rail'; tl.appendChild(rail);
  for (let i = 0; i <= 32; i++) { const k = document.createElement('div'); k.className = 'tick' + (i % 4 === 0 ? ' bar' : ''); k.style.left = (100 * i / 32) + '%'; rail.appendChild(k); }
  const fill = document.createElement('div'); fill.className = 'fill'; rail.appendChild(fill);
  const head = document.createElement('div'); head.className = 'head'; rail.appendChild(head);

  // --- boot at a resolution the device can hold
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cssW = document.getElementById('stage').clientWidth || 960;
  let scale = capture ? parseFloat(q.get('scale') || '1') : Math.max(0.5, Math.min(1, (cssW * dpr) / 1920));
  await R.boot(canvas, scale);
  window.__ready = true;
  if (capture) return;

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const veil = document.getElementById('veil'), playBtn = document.getElementById('play'), readout = document.getElementById('readout');
  let playing = !reduce, t = reduce ? R.b(14.4) : 0, last = performance.now(), slow = 0;
  const pad = (n) => String(Math.floor(n)).padStart(2, '0');
  function paint() {
    R.renderAt(t);
    const B = t / R.BEAT, beat = Math.floor(B + 1e-6);
    fill.style.width = head.style.left = (100 * t / R.DURATION) + '%';
    readout.textContent = `${pad(t)}:${pad((t % 1) * 100)}:${pad(Math.floor(t * 60) % 60)} · bar ${Math.floor(beat / 4) + 1}.${beat % 4 + 1}`;
    segs.forEach((s, i) => s.classList.toggle('on', B >= CH[i][0] && B < CH[i][1]));
    tl.setAttribute('aria-valuenow', t.toFixed(2));
  }
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing) {
      t = (t + dt) % R.DURATION;
      // adaptive resolution: step down when the device can't hold ~40 fps
      if (dt > 1 / 40) slow++; else slow = Math.max(0, slow - 1);
      if (slow > 20 && scale > 0.5) { scale = Math.max(0.5, +(scale - 0.25).toFixed(2)); R.resize(scale); slow = 0; }
    }
    paint();
    requestAnimationFrame(frame);
  }
  function setPlaying(v) { playing = v; playBtn.textContent = v ? 'Pause' : 'Play'; veil.hidden = true; last = performance.now(); }
  if (reduce) { veil.hidden = false; playBtn.textContent = 'Play'; }
  veil.addEventListener('click', () => setPlaying(true));
  playBtn.addEventListener('click', () => setPlaying(!playing));
  const seekTo = (x) => { const r = tl.getBoundingClientRect(); t = Math.max(0, Math.min(R.DURATION - 1e-3, R.DURATION * (x - r.left) / r.width)); };
  let drag = false;
  tl.addEventListener('pointerdown', (e) => { drag = true; tl.setPointerCapture(e.pointerId); seekTo(e.clientX); });
  tl.addEventListener('pointermove', (e) => { if (drag) seekTo(e.clientX); });
  tl.addEventListener('pointerup', () => { drag = false; });
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (e.code === 'ArrowRight') { setPlaying(false); t = Math.min(R.DURATION - 1e-3, t + 1 / 60); }
    else if (e.code === 'ArrowLeft') { setPlaying(false); t = Math.max(0, t - 1 / 60); }
    else if (e.code === 'BracketRight') { setPlaying(false); t = Math.min(R.DURATION - 1e-3, R.b(Math.floor(t / R.BEAT + 1e-6) + 1)); }
    else if (e.code === 'BracketLeft') { setPlaying(false); t = Math.max(0, R.b(Math.ceil(t / R.BEAT - 1e-6) - 1)); }
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
