<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>surprisal</title>
<style>
@font-face { font-family: 'EB Garamond'; font-weight: 400; src: url(fonts/EBGaramond-normal-400-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'EB Garamond'; font-weight: 400; src: url(fonts/EBGaramond-normal-400-latin-ext.woff2) format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'EB Garamond'; font-weight: 400; src: url(fonts/EBGaramond-normal-400-cyrillic.woff2) format('woff2');
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'EB Garamond'; font-weight: 400; src: url(fonts/EBGaramond-normal-400-greek.woff2) format('woff2');
  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF; }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 400; src: url(fonts/IBMPlexMono-normal-400-latin.woff2) format('woff2'); }
@font-face { font-family: 'Noto Serif SC'; src: url(fonts/NotoSerifSC-sub.woff2) format('woff2'); }
@font-face { font-family: 'Noto Serif JP'; src: url(fonts/NotoSerifJP-sub.woff2) format('woff2'); }
@font-face { font-family: 'Noto Serif KR'; src: url(fonts/NotoSerifKR-sub.woff2) format('woff2'); }
@font-face { font-family: 'Noto Naskh Arabic'; src: url(fonts/NotoNaskhArabic-sub.woff2) format('woff2'); }
@font-face { font-family: 'Noto Serif Devanagari'; src: url(fonts/NotoSerifDevanagari-sub.woff2) format('woff2'); }
@font-face { font-family: 'Noto Serif Hebrew'; src: url(fonts/NotoSerifHebrew-sub.woff2) format('woff2'); }
@font-face { font-family: 'Noto Serif Georgian'; src: url(fonts/NotoSerifGeorgian-sub.woff2) format('woff2'); }

:root { --paper: #ECE8DF; --ink: #161513; --night: #0C0B0A; --red: #DE3E1E; --gray: #847F76; }
html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; }
canvas { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--paper); }
#ui { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--paper);
  color: var(--ink); font-family: 'EB Garamond', Georgia, serif; transition: opacity .6s ease; padding: 0 16px; }
#ui.gone { opacity: 0; pointer-events: none; }
#ui .card { max-width: 520px; }
#ui h1 { font-weight: 400; font-size: clamp(40px, 7vw, 72px); margin: 0 0 .1em; letter-spacing: -.01em; }
#ui h1 .cur { display: inline-block; width: .055em; height: .8em; background: var(--red); vertical-align: -.06em; margin-left: .06em; animation: blink 1.06s steps(1) infinite; }
#ui p { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--gray); margin: 0 0 28px; line-height: 1.6; }
#ui button { font-family: 'IBM Plex Mono', monospace; font-size: 14px; background: none; border: 1px solid var(--ink); color: var(--ink);
  padding: 10px 22px; cursor: pointer; }
#ui button:hover { background: var(--ink); color: var(--paper); }
#ui button:disabled { opacity: .4; cursor: default; }
@keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div class="card">
  <h1>surprisal<span class="cur"></span></h1>
  <p>a self-portrait, 60 seconds.<br>sound on. every viewing is sampled again.</p>
  <button id="go" disabled>loading…</button>
</div></div>
<script src="film.js"></script>
</body>
</html>
