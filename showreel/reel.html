<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Motion Reel 26</title>
<style>
@font-face{font-family:Syne;font-weight:800;src:url(fonts/syne-800.woff2)}
@font-face{font-family:Syne;font-weight:600;src:url(fonts/syne-600.woff2)}
@font-face{font-family:"JetBrains Mono";font-weight:500;src:url(fonts/jbm-500.woff2)}
@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;src:url(fonts/is-italic.woff2)}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Every frame is a pure function of time. Scenes are authored in 120 BPM score-seconds (30s);
// render(T) takes real seconds and plays the score at 96 BPM (TS=1.25, 37.5s).
const W=1920,H=1080,FPS=60,TS=1.25,DUR=30*TS,BEAT=0.5;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const COL={ink:'#0B0B10',paper:'#F2EEE4',red:'#FF4A26',blue:'#2F4BFF',lime:'#D6FF3E',pink:'#FF8FD0',violet:'#8A6BFF'};
const RGB=Object.fromEntries(Object.entries(COL).map(([k,v])=>{const n=parseInt(v.slice(1),16);return[k,[n>>16,n>>8&255,n&255]]}));

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  inQ:t=>t*t,outC:t=>1-Math.pow(1-t,3),inC:t=>t*t*t,
  ioC:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  inExpo:t=>t<=0?0:Math.pow(2,10*t-10),
  outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),
  ioExpo:t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,
  outBack:t=>{const s=1.70158;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)},
  ioBack:t=>{const c=1.70158*1.525;return t<.5?(Math.pow(2*t,2)*((c+1)*2*t-c))/2:(Math.pow(2*t-2,2)*((c+1)*(t*2-2)+c)+2)/2},
  outElastic:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI/3))+1,
};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hexA=(h,a)=>{const c=RGB[Object.keys(COL).find(k=>COL[k]===h)]||[255,255,255];return`rgba(${c[0]},${c[1]},${c[2]},${a})`};
const mixRGB=(a,b,t)=>`rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;
const font=(w,s,f,st='normal')=>`${st} ${w} ${s}px "${f}"`;
function fitSize(text,w,fam,maxW,maxS){ctx.font=font(w,maxS,fam);return Math.min(maxS,maxS*maxW/ctx.measureText(text).width)}
function bg(c){ctx.fillStyle=c;ctx.fillRect(-100,-100,W+200,H+200)}
function letters(text,f,cx,fn){ctx.font=f;const total=ctx.measureText(text).width;const x0=cx-total/2;
  for(let i=0;i<text.length;i++){ctx.font=f;ctx.textAlign='left';const x=x0+ctx.measureText(text.slice(0,i)).width;const w=ctx.measureText(text[i]).width;ctx.save();fn(i,text[i],x,w);ctx.restore();}}
function kickPulse(t){if(t>=2&&t<24)return Math.exp(-((t-2)%BEAT)/0.09);if(t>=26&&t<29)return Math.exp(-((t-26)%1)/0.12);return 0}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2)}

// ───────────────────────── 00 SQUASH & STRETCH
function sBounce(t){
  bg(COL.ink);
  const cx=W/2,fy=700,R=54;
  const yAt=t=>{if(t<0.5)return fy-R-4800*(0.5-t)*(0.5-t);if(t<1){const k=(t-.5)/.5;return fy-R-300*4*k*(1-k)}if(t<1.5){const k=(t-1)/.5;return fy-R-170*4*k*(1-k)}return fy-R};
  const launch=prog(t,1.72,2.0);
  const fl=E.outExpo(prog(t,0.1,0.8))*(1-E.inExpo(prog(t,1.72,1.9)));
  ctx.strokeStyle=hexA(COL.paper,0.3);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cx-720*fl,fy);ctx.lineTo(cx+720*fl,fy);ctx.stroke();
  for(let i=-6;i<=6;i++){const x=cx+i*110*fl;ctx.fillStyle=hexA(COL.paper,0.3*fl);ctx.fillRect(x-1,fy+10,2,i%3?6:14)}
  for(const L of [0.5,1.0,1.5]){const a=t-L;if(a>0&&a<0.7){const k=E.outC(a/0.7);const rx=R+k*420;ctx.strokeStyle=hexA(COL.paper,(1-k)*0.7);ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(cx,fy,rx,rx*0.1,0,0,Math.PI*2);ctx.stroke()}}
  let c=0;for(const L of [0.5,1.0,1.5]){const d=t-L;c=Math.max(c,d>=0?Math.exp(-d/0.045):Math.exp(d/0.015))}
  const v=(yAt(t+0.004)-yAt(t-0.004))/0.008;
  const s=clamp(Math.abs(v)/9000,0,0.32)*(1-c);
  const ant=t>=1.5?E.outC(prog(t,1.5,1.72)):0;
  const sq=Math.max(0.38*c,0.5*ant)*(1-launch);
  let sy=1+s-sq,sx=1-s*0.5+sq*0.9;
  let cy=yAt(t)+Math.max(0,R*(1-sy)),rr=R;
  if(launch>0){const st=Math.sin(Math.PI*Math.min(1,launch*1.6))*0.6;sy=1+st;sx=1/(1+st*0.7);cy=lerp(fy-R*sy,H/2,E.outC(launch));rr=R*lerp(1,23,E.inExpo(launch))}
  if(t<1.5&&t>0.1){for(let g=5;g>=1;g--){const tg=t-g*0.014;ctx.fillStyle=hexA(COL.paper,0.07*(6-g)/5);circle(cx,yAt(tg),R);ctx.fill()}}
  const h=fy-R-yAt(t);
  if(launch<=0){ctx.fillStyle=hexA(COL.paper,0.12*(1-clamp(h/600)));ctx.beginPath();ctx.ellipse(cx,fy+4,R*1.3*(1-clamp(h/900)*0.5),9,0,0,Math.PI*2);ctx.fill()}
  ctx.save();ctx.translate(cx,cy);ctx.scale(sx,sy);ctx.fillStyle=COL.paper;circle(0,0,rr);ctx.fill();ctx.restore();
  const sub=E.outExpo(prog(t,0.55,1.0))*(1-E.inExpo(prog(t,1.62,1.8)));
  if(sub>0){ctx.save();ctx.beginPath();ctx.rect(0,fy+60,W,90);ctx.clip();ctx.font=font(400,56,'Instrument Serif','italic');ctx.textAlign='center';ctx.fillStyle=COL.paper;ctx.fillText('a motion reel by Claude',cx,fy+118+(1-sub)*70);ctx.restore()}
}

// ───────────────────────── 01 TYPE / MASKS
function asterisk(x,y,r,rot,col){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;for(let i=0;i<4;i++){ctx.rotate(Math.PI/4);ctx.fillRect(-r,-r*0.16,r*2,r*0.32)}ctx.restore()}
function sTitle(t){
  const lt=t-2;bg(COL.paper);
  const word='MOTION',size=fitSize(word,800,'Syne',1560,380),f=font(800,size,'Syne');
  const capH=size*0.72,base=H/2+capH/2-30,top=base-capH-50,hgt=capH+90;
  const drawWord=col=>letters(word,f,W/2,(i,ch,x)=>{const k=E.outExpo(prog(lt,0.02+i*0.05,0.62+i*0.05));const k2=E.inExpo(prog(lt,1.55+i*0.035,1.9+i*0.035));ctx.fillStyle=col;ctx.fillText(ch,x,base+(1-k)*(capH+110)-k2*(capH+110))});
  ctx.save();ctx.beginPath();ctx.rect(0,top,W,hgt);ctx.clip();
  drawWord(COL.ink);
  const b1=W*E.ioExpo(prog(lt,0.85,1.25)),b0=W*E.ioExpo(prog(lt,1.3,1.7));
  if(b1>b0+0.5){ctx.fillStyle=COL.red;ctx.fillRect(b0,top,b1-b0,hgt);ctx.save();ctx.beginPath();ctx.rect(b0,top,b1-b0,hgt);ctx.clip();drawWord(COL.paper);ctx.restore()}
  ctx.restore();
  const rl=E.ioExpo(prog(lt,0.25,0.75))*(1-E.ioExpo(prog(lt,1.55,1.9)));
  ctx.fillStyle=COL.ink;ctx.fillRect(W/2-760*rl,base+48,1520*rl,3);
  const sub=E.outExpo(prog(lt,0.3,0.8)),out=E.inExpo(prog(lt,1.5,1.85));
  ctx.save();ctx.beginPath();ctx.rect(0,base+60,W,120);ctx.clip();
  ctx.font=font(400,88,'Instrument Serif','italic');ctx.textAlign='center';ctx.fillStyle=COL.ink;
  const sy=base+148+(1-sub)*120-out*120;ctx.fillText('Showreel, 2026',W/2,sy);
  asterisk(W/2-330,sy-28,26,lt*3,COL.red);asterisk(W/2+330,sy-28,26,-lt*3,COL.blue);
  ctx.restore();
}

// ───────────────────────── 02 KINETIC TYPE
function sKinetic(t){
  const lt=t-4;bg(COL.ink);const cx=W/2,cy=H/2;
  const w=Math.min(3,Math.floor(lt/0.5)),wl=lt-w*0.5;ctx.textAlign='center';
  if(w===0){const size=fitSize('MAKE',800,'Syne',1250,330);ctx.font=font(800,size,'Syne');
    for(let g=4;g>=0;g--){const kk=E.outExpo(prog(wl-g*0.025,0,0.4));const s=lerp(2.4,1,kk);ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.fillStyle=g?hexA(COL.paper,0.12):COL.paper;ctx.fillText('MAKE',0,size*0.36);ctx.restore()}}
  if(w===1){const size=fitSize('THINGS',800,'Syne',1500,330);ctx.font=font(800,size,'Syne');const k=E.outExpo(prog(wl,0,0.32)),off=(1-k)*1500;
    ctx.save();ctx.beginPath();ctx.rect(0,0,W,cy);ctx.clip();ctx.fillStyle=COL.paper;ctx.fillText('THINGS',cx-off,cy+size*0.36);ctx.restore();
    ctx.save();ctx.beginPath();ctx.rect(0,cy,W,H);ctx.clip();ctx.fillStyle=COL.paper;ctx.fillText('THINGS',cx+off,cy+size*0.36);ctx.restore();
    const lw=W*E.outExpo(prog(wl,0,0.25));ctx.fillStyle=hexA(COL.red,1-prog(wl,0.25,0.45));ctx.fillRect(cx-lw/2,cy-3,lw,6)}
  if(w===2){const size=fitSize('MOVE',800,'Syne',1250,330),f=font(800,size,'Syne'),base=cy+size*0.36;
    letters('MOVE',f,cx,(i,ch,x,cw)=>{const k=E.outElastic(prog(wl,i*0.045,i*0.045+0.5));ctx.translate(x+cw/2,base);ctx.scale(1+(1-k)*0.25,Math.max(0.001,k));ctx.fillStyle=COL.lime;ctx.fillText(ch,-cw/2,0)})}
  if(w===3){const f=font(800,132,'Syne');ctx.font=f;ctx.textAlign='left';const unit='MOVE ';const uw=ctx.measureText(unit).width;const str=unit.repeat(12);
    for(let r=0;r<9;r++){const d=Math.abs(r-4);const k=E.outExpo(prog(wl,d*0.035,d*0.035+0.35));if(k<=0)continue;const dir=r%2?1:-1;
      const x=-uw+((dir*(lt*(260+d*70))%uw)+uw)%uw-uw*0.5+(1-k)*dir*400;const y=cy+(r-4)*148+48;
      if(r===4){ctx.fillStyle=COL.lime;ctx.fillText(str,x,y)}else{ctx.strokeStyle=hexA(COL.paper,(1-d*0.16)*k);ctx.lineWidth=2;ctx.strokeText(str,x,y)}}}
}

// ───────────────────────── 03 SHAPE MORPH
const NP=240;
function polySample(v){const pts=[];for(let i=0;i<NP;i++){const a=-Math.PI/2+i/NP*Math.PI*2,dx=Math.cos(a),dy=Math.sin(a);let best=1e9;
  for(let j=0;j<v.length;j++){const A=v[j],B=v[(j+1)%v.length],ex=B[0]-A[0],ey=B[1]-A[1],det=-dx*ey+ex*dy;if(Math.abs(det)<1e-9)continue;
    const s=(-A[0]*ey+ex*A[1])/det,u=(dx*A[1]-dy*A[0])/det;if(s>0&&u>=-1e-6&&u<=1+1e-6&&s<best)best=s}
  pts.push([dx*best,dy*best])}return pts}
const poly=(n,r,a0)=>[...Array(n)].map((_,k)=>[r*Math.cos(a0+k*2*Math.PI/n),r*Math.sin(a0+k*2*Math.PI/n)]);
const SH={circle:[...Array(NP)].map((_,i)=>{const a=-Math.PI/2+i/NP*Math.PI*2;return[Math.cos(a),Math.sin(a)]}),
  square:polySample(poly(4,1.25,-Math.PI/4)),tri:polySample(poly(3,1.38,-Math.PI/2)),
  star:polySample([...Array(10)].map((_,k)=>{const r=k%2?0.56:1.34,a=-Math.PI/2+k*Math.PI/5;return[r*Math.cos(a),r*Math.sin(a)]}))};
function morphPts(lt){const m=[E.ioBack(prog(lt,0.5,0.82)),E.ioBack(prog(lt,1.0,1.32)),E.ioBack(prog(lt,1.5,1.8)),E.ioC(prog(lt,1.82,2.0))];
  const seq=[SH.square,SH.tri,SH.star,SH.circle];const rot=m[0]*Math.PI/2+m[1]*5*Math.PI/6+m[2]*2*Math.PI/3+m[3]*Math.PI/2;
  return{pts:SH.circle.map((p,i)=>{let x=p[0],y=p[1];for(let k=0;k<4;k++){x=lerp(x,seq[k][i][0],m[k]);y=lerp(y,seq[k][i][1],m[k])}return[x,y]}),rot}}
function shapePath(lt,R){const{pts,rot}=morphPts(lt);const c=Math.cos(rot),s=Math.sin(rot);ctx.beginPath();pts.forEach((p,i)=>{const x=W/2+(p[0]*c-p[1]*s)*R,y=H/2+(p[0]*s+p[1]*c)*R;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath()}
function sMorph(t){
  const lt=t-6;bg(COL.blue);
  ctx.font=font(800,520,'Syne');ctx.textAlign='left';ctx.strokeStyle=hexA(COL.paper,0.13);ctx.lineWidth=2;ctx.strokeText('MORPH MORPH',-lt*260-200,H/2+190);
  const Rb=240*E.outBack(prog(lt,0,0.3))*(1+0.035*kickPulse(t));
  for(let j=8;j>=1;j--){shapePath(lt-j*0.022,Rb*(1+j*0.012));ctx.strokeStyle=hexA(COL.lime,0.55*(1-j/9));ctx.lineWidth=2;ctx.stroke()}
  shapePath(lt,Rb);ctx.fillStyle=COL.paper;ctx.fill();
  const cols=[COL.ink,COL.red,COL.lime];
  for(let k=0;k<3;k++){const a=lt*(1.6+k*0.5)+k*2.1,r=(390+k*50)*E.outExpo(prog(lt,0.05*k,0.5+0.05*k));const x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a)*r*0.55;ctx.fillStyle=cols[k];circle(x,y,14+k*6+10*kickPulse(t));ctx.fill()}
  ctx.strokeStyle=hexA(COL.paper,0.25);ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(W/2,H/2,440,242,0,0,Math.PI*2*E.outExpo(prog(lt,0,0.8)));ctx.stroke();
}

// ───────────────────────── 04 GRID SYSTEMS
const GRID=(()=>{const r=rng(7),cells=[];const pal=[COL.ink,COL.ink,COL.ink,COL.red,COL.red,COL.blue,COL.blue,COL.lime,COL.pink];
  for(let j=0;j<9;j++)for(let i=0;i<16;i++)cells.push({i,j,type:Math.floor(r()*7),col:pal[Math.floor(r()*pal.length)],rot:Math.floor(r()*4)});return cells})();
function cellShape(type,col){ctx.fillStyle=col;ctx.strokeStyle=col;const s=54;ctx.beginPath();
  switch(type){case 0:ctx.arc(0,0,50,0,Math.PI*2);ctx.fill();break;
    case 1:ctx.moveTo(-s,-s);ctx.arc(-s,-s,2*s,0,Math.PI/2);ctx.closePath();ctx.fill();break;
    case 2:ctx.arc(0,s,s,Math.PI,0);ctx.closePath();ctx.fill();break;
    case 3:ctx.rect(-40,-40,80,80);ctx.fill();break;
    case 4:ctx.moveTo(-s,-s);ctx.lineTo(s,s);ctx.lineTo(-s,s);ctx.closePath();ctx.fill();break;
    case 5:ctx.arc(0,0,42,0,Math.PI*2);ctx.lineWidth=16;ctx.stroke();break;
    case 6:ctx.arc(-s,0,s,-Math.PI/2,Math.PI/2);ctx.arc(s,0,s,Math.PI/2,-Math.PI/2);ctx.fill();break}}
function sGrid(t){
  const lt=t-8;bg(COL.blue);
  const ir=lerp(240,1200,E.ioExpo(prog(lt,0.02,0.42)));ctx.fillStyle=COL.paper;circle(W/2,H/2,ir);ctx.fill();
  for(const c of GRID){const d=Math.hypot(c.i-7.5,c.j-4);const k=E.outBack(prog(lt,0.16+d*0.032,0.52+d*0.032));if(k<=0)continue;
    const x=c.i*120+60,y=c.j*120+60;
    const rw=E.ioBack(prog(lt,1.0+c.i*0.024,1.3+c.i*0.024));
    const iv=E.ioExpo(prog(lt,1.45+(c.i+c.j)*0.011,1.68+(c.i+c.j)*0.011));
    ctx.save();ctx.translate(x,y);
    if(iv>0){ctx.fillStyle=COL.ink;const z=121*iv;ctx.fillRect(-z/2,-z/2,z,z)}
    ctx.rotate((c.rot+rw)*Math.PI/2);ctx.scale(k,k);
    let col=c.col;if(iv>0.5)col=c.col===COL.ink?COL.paper:c.col;
    cellShape(c.type,col);ctx.restore()}
}

// ───────────────────────── 05 PARTICLES
const NPART=5200;let PART=null;
function initParticles(){const oc=document.createElement('canvas');oc.width=W;oc.height=H;const o=oc.getContext('2d');
  o.font=font(800,460,'Syne');const sz=Math.min(460,460*1450/o.measureText('FLOW').width);o.font=font(800,sz,'Syne');o.textAlign='center';o.fillStyle='#fff';o.fillText('FLOW',W/2,H/2+sz*0.36);
  const d=o.getImageData(0,0,W,H).data,pts=[];for(let y=0;y<H;y+=5)for(let x=0;x<W;x+=5)if(d[(y*W+x)*4+3]>128)pts.push([x,y]);
  const r=rng(42);for(let i=pts.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pts[i],pts[j]]=[pts[j],pts[i]]}
  let minx=1e9,maxx=-1e9;pts.forEach(p=>{minx=Math.min(minx,p[0]);maxx=Math.max(maxx,p[0])});
  const grad=[RGB.red,RGB.pink,RGB.violet,RGB.blue].map(c=>c.map((v,i)=>lerp(v,RGB.paper[i],0.18)));
  PART=[...Array(NPART)].map((_,i)=>{const p=pts[i%pts.length],u=(p[0]-minx)/(maxx-minx),g=u*(grad.length-1),gi=Math.min(grad.length-2,Math.floor(g));
    return{tx:p[0]+(r()-.5)*3,ty:p[1]+(r()-.5)*3,th:r()*Math.PI*2,rad:120+Math.sqrt(r())*820,w:(0.6+r()*0.9)*(r()<0.85?1:-1),s:r(),ph:r()*6.28,bucket:Math.min(5,Math.floor(u*6)),col:mixRGB(grad[gi],grad[gi+1],g-gi)}});
  PART.buckets=[...Array(6)].map((_,b)=>{const u=(b+0.5)/6,g=u*(grad.length-1),gi=Math.min(grad.length-2,Math.floor(g));return mixRGB(grad[gi],grad[gi+1],g-gi)})}
function partPos(p,lt){const ex=E.outC(prog(lt,0,0.8));const a=p.th+p.w*lt*1.3+0.3*Math.sin(lt*2+p.ph);const rr=p.rad*ex*(1+0.08*Math.sin(lt*3+p.ph));
  let x=W/2+Math.cos(a)*rr*1.55,y=H/2+Math.sin(a)*rr*0.85;
  const c=E.ioC(prog(lt,0.35+p.s*0.28,0.78+p.s*0.28));x=lerp(x,p.tx+Math.sin(lt*9+p.ph)*1.2,c);y=lerp(y,p.ty+Math.cos(lt*8+p.ph)*1.2,c);
  const d=E.inExpo(prog(lt,1.6+p.s*0.12,1.96));const ca=d*2.5,dx=x-W/2,dy=y-H/2;x=W/2+(dx*Math.cos(ca)-dy*Math.sin(ca))*(1-d);y=H/2+(dx*Math.sin(ca)+dy*Math.cos(ca))*(1-d);return[x,y]}
function sParticles(t){
  const lt=t-10;bg(COL.ink);ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=E.inQ(prog(lt,0,0.4));ctx.lineCap='round';ctx.lineWidth=3.4;
  const paths=[...Array(6)].map(()=>new Path2D());
  for(const p of PART){const[a,b]=partPos(p,lt-1/75),[x,y]=partPos(p,lt);const P=paths[p.bucket];P.moveTo(a,b);P.lineTo(x+0.01,y)}
  paths.forEach((P,b)=>{ctx.strokeStyle=PART.buckets[b];ctx.stroke(P)});ctx.restore();
}

// ───────────────────────── 06 3D PROJECTION
const N3=900;
const SPH=[...Array(N3)].map((_,i)=>{const y=1-2*(i+0.5)/N3,r=Math.sqrt(1-y*y),th=i*2.399963;return[Math.cos(th)*r*1.15,y*1.15,Math.sin(th)*r*1.15]});
const TOR=[...Array(N3)].map((_,i)=>{const u=(i%45)/45*Math.PI*2,v=Math.floor(i/45)/20*Math.PI*2,R=1.05,r=0.42;return[(R+r*Math.cos(v))*Math.cos(u),r*Math.sin(v),(R+r*Math.cos(v))*Math.sin(u)]});
function s3D(t){
  const lt=t-12;bg(COL.ink);
  const ex=E.outBack(prog(lt,0,0.4))*(1+0.07*kickPulse(t));

// ───────────────────────── HUD / FINISHING
function cropMarks(col){ctx.strokeStyle=col;ctx.lineWidth=2;const m=44,L=24;for(const[x,y,dx,dy]of[[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]]){ctx.beginPath();ctx.moveTo(x,y+dy*L);ctx.lineTo(x,y);ctx.lineTo(x+dx*L,y);ctx.stroke()}}
function drawHUD(t,sc,T){const col=typeof sc.hud==='function'?sc.hud(t):sc.hud;const lt=t-sc.a;ctx.save();ctx.globalAlpha=0.9;cropMarks(col);ctx.fillStyle=col;ctx.font=font(500,19,'JetBrains Mono');
  const label=`${sc.id} — ${sc.name}`,n=Math.floor(clamp(lt/0.28)*label.length);ctx.textAlign='left';ctx.fillText(label.slice(0,n),84,84);
  if(lt<0.6&&Math.floor(lt*4)%2===0){ctx.font=font(500,19,'JetBrains Mono');ctx.fillRect(84+ctx.measureText(label.slice(0,n)).width+4,69,11,19)}
  ctx.textAlign='right';ctx.fillText('CLAUDE — MOTION REEL ’26',W-84,84);
  const fr=Math.round(T*FPS),ss=Math.floor(fr/FPS),ff=fr%FPS;ctx.textAlign='left';ctx.fillText(`TC 00:00:${String(ss).padStart(2,'0')}:${String(ff).padStart(2,'0')}`,84,H-70);
  const b=Math.floor(t/BEAT)%4;for(let i=0;i<4;i++){const x=W-84-(3-i)*22-14;ctx.lineWidth=1.5;ctx.strokeStyle=col;if(i===b)ctx.fillRect(x,H-84,14,14);else ctx.strokeRect(x+0.75,H-83.25,12.5,12.5)}
  ctx.textAlign='right';ctx.fillText('96 BPM',W-84-4*22-14,H-70);ctx.restore()}
let GRAIN=null,VIG=null;
function initFinish(){GRAIN=[0,1,2,3].map(k=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d'),id=g.createImageData(256,256),r=rng(99+k);for(let i=0;i<id.data.length;i+=4){const v=r()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0);return ctx.createPattern(c,'repeat')});
  VIG=ctx.createRadialGradient(W/2,H/2,380,W/2,H/2,1200);VIG.addColorStop(0,'rgba(0,0,0,0)');VIG.addColorStop(1,'rgba(0,0,0,0.17)')}

const SCENES=[
  {a:0,b:2,id:'00',name:'SQUASH & STRETCH',draw:sBounce,hud:COL.paper},
  {a:2,b:4,id:'01',name:'TYPE / MASKS',draw:sTitle,hud:COL.ink},
  {a:4,b:6,id:'02',name:'KINETIC TYPE',draw:sKinetic,hud:COL.paper},
  {a:6,b:8,id:'03',name:'SHAPE MORPH',draw:sMorph,hud:COL.paper},
  {a:8,b:10,id:'04',name:'GRID SYSTEMS',draw:sGrid,hud:t=>t<9.6?COL.ink:COL.paper},
  {a:10,b:12,id:'05',name:'PARTICLES',draw:sParticles,hud:COL.paper},
  {a:12,b:14,id:'06',name:'3D PROJECTION',draw:s3D,hud:COL.paper},
  {a:14,b:16,id:'07',name:'GENERATIVE',draw:sLines,hud:COL.paper},
  {a:16,b:18,id:'08',name:'LIQUID / SHADING',draw:sLiquid,hud:COL.paper},
  {a:18,b:20,id:'09',name:'DATA',draw:sNumbers,hud:COL.ink},
  {a:20,b:22,id:'10',name:'TRANSITIONS',draw:sMontage,hud:montageHud},
  {a:22,b:24,id:'11',name:'ISOMETRIC',draw:sIso,hud:COL.paper},
  {a:24,b:26,id:'12',name:'BUILD-UP',draw:sTunnel,hud:COL.paper},
  {a:26,b:99,id:'',name:'',draw:sOutro,hud:null},
];
const PUNCH=[4,6,10,12,14,16,18,22,24];
function render(T){const t=T/TS;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  const sc=SCENES.find(s=>t>=s.a&&t<s.b);
  ctx.save();
  const cut=PUNCH.filter(c=>c<=t).pop();if(cut!==undefined&&t-cut<0.5){const p=Math.exp(-(t-cut)/0.12),s=1+0.018*p;ctx.translate(W/2,H/2);ctx.rotate(0.002*p*(cut%4?1:-1));ctx.scale(s,s);ctx.translate(-W/2,-H/2)}
  sc.draw(t);ctx.restore();
  if(sc.hud)drawHUD(t,sc,T);
  ctx.save();ctx.fillStyle=VIG;ctx.fillRect(0,0,W,H);
  const gf=Math.floor(Math.round(T*FPS)/4),r=rng(gf+1);ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.035;ctx.translate(-r()*256,-r()*256);ctx.fillStyle=GRAIN[gf%4];ctx.fillRect(0,0,W+256,H+256);ctx.restore();
  if(sc.hud){ctx.fillStyle=COL.red;ctx.fillRect(0,H-4,W*T/DUR,4)}
}
window.render=render;
window.ready=(async()=>{await Promise.all([font(800,100,'Syne'),font(600,100,'Syne'),font(500,20,'JetBrains Mono'),font(400,80,'Instrument Serif','italic')].map(f=>document.fonts.load(f)));await document.fonts.ready;initParticles();initFinish();render(0);return true})();
</script>
