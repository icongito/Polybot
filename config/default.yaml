# Default Polybot configuration. Every key here mirrors a field on
# polybot.config.AppConfig and can be overridden by POLYBOT_* environment
# variables (double-underscore nested, e.g. POLYBOT_RISK__MAX_STAKE_PER_TRADE_USD).
mode: observe

assets: [BTC, ETH, SOL, XRP, DOGE, BNB, HYPE]

discovery:
  gamma_base_url: https://gamma-api.polymarket.com
  interval_seconds: 300
  preload_lead_s: 60.0
  poll_interval_s: 5.0

feeds:
  rtds_url: wss://ws-live-data.polymarket.com
  clob_ws_url: wss://ws-subscriptions-clob.polymarket.com/ws
  # Direct Chainlink Data Streams are used only when both api key/secret are
  # set (see .env.example); otherwise the free RTDS relay above is the
  # settlement source. This is the default specifically to keep the bot cheap
  # to run — RTDS and every exchange feed below are free public endpoints.
  chainlink_streams_api_key: ""
  chainlink_streams_api_secret: ""

risk:
  max_stake_per_trade_usd: 50.0
  max_stake_per_market_usd: 100.0
  max_daily_loss_usd: 200.0
  max_simultaneous_exposure_usd: 300.0
  max_orders_per_interval: 2
  min_net_edge: 0.03
  min_expected_profit_usd: 1.0
  max_entry_price: 0.97
  max_spread: 0.10
  max_clock_drift_s: 0.25
  kill_switch_file: data/KILL

endgame:
  window_s: 15.0
  hard_cutoff_s: 2.0
  min_probability: 0.70

storage:
  database_url: postgresql+asyncpg://polybot:polybot@localhost:5432/polybot
  redis_url: redis://localhost:6379/0
  capture_dir: data/capture

observability:
  metrics_port: 9109
  log_level: INFO
